# What scripts/package-suite.py needs on top of ./.github/actions/setup: the
# system libraries of the pinned packages, and rv to install them.
name: package-suite
description: System libraries and rv for the package suite
inputs:
  rv-version:
    description: the rv release to install
    default: "0.23.3"
  rv-sha256:
    description: of rv-v<version>-x86_64-unknown-linux-gnu.tar.gz (the runners are x86_64)
    default: 749ffd6cfd78b10834e11074f62e347e7d214b50ee1356de557733633aa5cf87
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RV_VERSION: ${{ inputs.rv-version }}
        RV_SHA256: ${{ inputs.rv-sha256 }}
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get install -y -qq --no-install-recommends $(sed -e 's/#.*//' tests/packages/apt.txt) > /dev/null
        tar=rv-v$RV_VERSION-x86_64-unknown-linux-gnu.tar.gz
        curl -fsSL -o "/tmp/$tar" "https://github.com/A2-ai/rv/releases/download/v$RV_VERSION/$tar"
        echo "$RV_SHA256  /tmp/$tar" | sha256sum -c -
        tar -xzf "/tmp/$tar" -C /usr/local/bin rv
        rv --version
