# The oracle's platform: Debian 13 (trixie) with its r-base-core 4.5.0-3,
# the GNU R the corpora were recorded with (glibc 2.41: GNU R uses the C
# library's sinpi & co., so results match to the last bit). Runs inside a
# debian:trixie container after checkout. In the CI image
# (.github/ci-image/Dockerfile) everything is installed already and this
# only exports R_HOME.
name: setup
description: GNU R 4.5.0 from Debian trixie, Rust, and the tools the harnesses need
inputs:
  rust:
    description: install the Rust toolchain
    default: "true"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RUST: ${{ inputs.rust }}
      run: |
        if [ -f /etc/robigo-ci-image ]; then
          image=$(cat /etc/robigo-ci-image)
          echo "CI image ($image): nothing to install"
          if [ "$RUST" = true ] && [ "$image" != rust ]; then
            echo "::error::this job needs Rust; use the CI image's rust target" >&2
            exit 1
          fi
        else
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends $(sed -e 's/#.*//' .github/ci-image/apt.txt) > /dev/null
        fi
        R --version | head -1
        echo "R_HOME=$(R RHOME)" >> "$GITHUB_ENV"
    - if: inputs.rust == 'true'
      shell: bash
      run: |
        if command -v rustup > /dev/null && [ -f /etc/robigo-ci-image ]; then
          rustup show active-toolchain
          exit 0
        fi
        # rustup refuses to run when $HOME differs from the euid's passwd home.
        # GitHub's container exports HOME=/github/home while root's home is
        # /root, so pin HOME to the euid's home for the whole job: rustup,
        # cargo and the registry cache then agree on one location.
        export HOME="$(getent passwd "$(id -u)" | cut -d: -f6)"
        echo "HOME=$HOME" >> "$GITHUB_ENV"
        curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
