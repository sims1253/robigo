# Monthly and grouped: one pull request per ecosystem. The version of Rust
# itself is pinned in rust-toolchain.toml and moved by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # A crate version is a candidate a week after its release (the default
    # is 3 days), so a compromised release is likely yanked before it lands.
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
