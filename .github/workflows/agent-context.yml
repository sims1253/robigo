# AGENTS.md is read in full by every agent session, so each byte it holds is
# paid on every task. A pull request that makes it bigger than CAP bytes fails
# here: cut text, or move detail into the docs AGENTS.md points to. Below the
# cap the file may grow and shrink freely. Raise CAP itself only on purpose.
# Required by the main ruleset with ci.yml's `Check`.
name: agent-context

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: agent-context-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  budget:
    name: Agent context budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FILE: AGENTS.md
      CAP: 10240
    steps:
      # GitHub's test merge commit.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: AGENTS.md
          sparse-checkout-cone-mode: false
      - name: Check the size cap
        run: |
          size=$(git cat-file -s "HEAD:$FILE" 2>/dev/null || echo 0)
          echo "$FILE: $size of $CAP bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$CAP" ]; then
            echo "::error file=$FILE::$FILE is $size bytes, over its cap of $CAP. Every agent reads it in full: cut text or move detail into the docs it points to."
            exit 1
          fi
