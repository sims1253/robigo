# Every push and pull request: build, unit tests and conformance, the test
# corpora with their ratchets, and the performance gate. See
# docs/verification.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every main commit gets its own group: its run publishes the perf baseline
# that pull requests built on that commit compare with (a shared group would
# cancel queued main runs). Pull requests cancel their superseded runs.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  packages: read

# bash with pipefail (GitHub runs `bash -eo pipefail` for `shell: bash`):
# the default `sh -e` takes a pipeline's status from its last command, so
# `corpus.py run ... | tee` passed even when the ratchet failed.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  LANGUAGE: en
  LC_ALL: C.UTF-8
  TZ: UTC

# Caches: only main saves (rust-cache `save-if`, actions/cache/save). A pull
# request's entry is readable by that pull request alone, and those entries
# filled half of the 10 GB cache and evicted main's (docs/ledger/test-infra.md).

jobs:
  # PRs that cannot change the binary's behaviour skip the build-dependent
  # heavy jobs (scripts/ci-select.py). main always runs everything.
  # It also makes sure the CI image (.github/ci-image) for this tree exists:
  # building and pushing it when the inputs changed, a few minutes once,
  # instead of every job installing R and Rust (~35 s each, ~33 jobs a run).
  # The GNU R 4.6.2 oracle image (oracle.Dockerfile) compiles R; it has
  # inputs of its own and rebuilds only when they change.
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      heavy: ${{ steps.sel.outputs.heavy }}
      mode: ${{ steps.sel.outputs.mode }}
      runtime: ${{ steps.sel.outputs.runtime }}
      rt: ${{ steps.sel.outputs.rt }}
      image_base: ${{ steps.image.outputs.base }}
      image_rust: ${{ steps.image.outputs.rust }}
      image_packages: ${{ steps.image.outputs.packages }}
      # One output per oracle image: scripts/ci-image.sh prints
      # `oracle_<version>` (dots as underscores) for each version in its
      # `oracles=(...)`. A version added there needs its line here.
      image_oracle_4_6_2: ${{ steps.image.outputs.oracle_4_6_2 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select jobs
        id: sel
        run: |
          python3 scripts/test-ci-select.py
          python3 scripts/ci-select.py --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      - name: CI image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin > /dev/null
          scripts/ci-image.sh ensure | tee -a "$GITHUB_OUTPUT"

  # Seconds of work: a formatting or lint mistake should not wait for a build.
  lint:
    needs: select
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: scripts/lint.sh
      - name: Corpus and oracle tooling
        run: |
          python3 scripts/test_corpus.py
          python3 scripts/test-oracle-diff.py
      - name: Target pruning
        run: python3 scripts/test-prune-target.py

  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Miri on RString and the Rc alias writes
        run: |
          rustup toolchain install nightly-2026-11-02 --profile minimal --component miri,rust-src
          cargo +nightly-2026-11-02 miri test -p robigo-runtime --lib -- value::

  # G3's runtime crates (docs/g3.md §14.1, §16): release tests, then the
  # same under gctorture; the verification modes add steps as they land.
  # Every pull request but a docs-only one runs it. One that touches only
  # those crates (`rt` mode) runs this instead of the heavy jobs:
  # scripts/rt-ci.py first checks that the robigo binary does not link them.
  rt:
    needs: select
    if: ${{ needs.select.outputs.rt == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rt
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rt crates (release, then gctorture)
        run: |
          python3 scripts/test-rt-ci.py
          python3 scripts/rt-ci.py

  build:
    needs: select
    if: ${{ needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # (release-tests restores it)
          shared-key: release
          # shared-key drops the Cargo.lock hash from rust-cache's key, and
          # an exact-key hit skips the save: without it the entry would
          # never refresh after a dependency bump
          key: ${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked --workspace
      # GNU R's base-package natives built from the R 4.5.0 sources
      # (docs/core.md §8): robigo's dyn.load serves the base packages with
      # them instead of the Rust ports (ROBIGO_NATIVES)
      - uses: actions/cache/restore@v6
        id: rsrc
        with:
          path: ~/.cache/robigo-research/rsrc
          key: r-4.5.0-sources
      - name: Base-package natives
        run: |
          scripts/build-natives.sh stats splines tools parallel utils grDevices graphics grid
          echo "ROBIGO_NATIVES=$PWD/.robigo/natives" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.rsrc.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/robigo-research/rsrc
          key: r-4.5.0-sources
      # The flat lazy-load cache (rdbflat.rs): startup stops inflating a
      # zlib stream per lazyLoadDBfetch. Enumerate the actual .rdx keys.
      - name: Flat lazy-load cache
        run: |
          mkdir -p .robigo/bin
          cp "$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/robigo" .robigo/bin/robigo
          scripts/build-rdbflat.sh
          python3 scripts/test-rdbflat.py
      - name: Ratchet markers
        run: python3 scripts/ratchet.py check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Parse corpus ratchet
        run: |
          python3 scripts/parse-corpus.py check fastr gnur-tests gnur-examples | tee -a "$GITHUB_STEP_SUMMARY"
      # names.c builtins missing or of the wrong kind, and new "not
      # implemented yet" refusals, against the baseline (with its controls)
      - name: Builtin coverage drift
        run: python3 scripts/builtin-coverage.py --check .robigo/bin/robigo | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the binary for later jobs
        run: |
          mkdir -p dist/natives
          cp "$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/robigo" dist/
          # each base package's shared object, and grDevices' cairo module
          for d in .robigo/natives/*/; do
            p=$(basename "$d"); [ -f "$d$p.so" ] && mkdir -p "dist/natives/$p" && cp "$d"*.so "dist/natives/$p/"
          done
          cp -r .robigo/rdbflat dist/rdbflat
      - uses: actions/upload-artifact@v7
        with:
          name: robigo
          path: dist
          retention-days: 7

  # The conservative stack scan's tests depend on frame layout, which
  # differs between profiles: the test job runs them under `quick`, this job
  # under the profile that ships (docs/ledger/core.md 2026-11-11). A job of
  # its own, off build's critical path: nothing waits for it.
  release-tests:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release
          key: ${{ hashFiles('Cargo.lock') }}
          # build saves the release dependencies; the test harnesses are
          # compiled here
          save-if: false
      - name: Core, C API and heap tests (release)
        run: cargo test --release --locked -p robigo-core -p robigo-capi -p robigo-heap

  # Compiling the test harnesses took 85% of this step when it ran inside
  # build at release settings, and every job below waited for it. Here they
  # build in the quick profile, and conformance tests the release binary.
  test:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      ROBIGO_CONF_BIN: ${{ github.workspace }}/dist/robigo
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: quick
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: |
          chmod +x dist/robigo
          echo "ROBIGO_NATIVES=$PWD/dist/natives" >> "$GITHUB_ENV"
      - name: Unit tests, parser oracle, conformance (all tiers)
        # The conformance results go to the progress page with the corpora
        # (scripts/history.py records the open gaps from them).
        env:
          ROBIGO_CONF_RESULTS: ${{ github.workspace }}/.robigo/conformance-results/conformance.json
        run: cargo test --locked --profile quick --workspace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-conformance-1of1
          path: .robigo/conformance-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Core, C API and heap under gctorture (collect on every allocation)
        run: ROBIGO_GCTORTURE=1 cargo test --locked --profile quick -p robigo-core -p robigo-capi -p robigo-heap

  bytecode-fidelity:
    needs: select
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: bytecode-fidelity
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Bytecode metadata and encoding round trips
        run: cargo test --locked --profile quick -p robigo-runtime -p robigo-capi --features bytecode-fidelity
      - name: GNU bytecode fixtures in all three tiers
        run: |
          export ROBIGO_CONF_FILTER=tests/r/serialize/bytecode_
          ROBIGO_COMPILE=0 cargo test --locked --profile quick -p robigo-cli --features bytecode-fidelity --test conformance -- --exact conformance --nocapture
          ROBIGO_JIT=0 cargo test --locked --profile quick -p robigo-cli --features bytecode-fidelity --test conformance -- --exact conformance --nocapture
          cargo test --locked --profile quick -p robigo-cli --features bytecode-fidelity --test conformance -- --exact conformance --nocapture

  # Work counters on fixed loops (scripts/counters.py, docs/verification.md
  # "Counter gate"): vector copies, promises, environments, allocations, VM
  # ops and JIT deopts per iteration, held to tests/counters' bounds and the
  # shrink-only known list. Its own quick build with `--features counters`
  # (a few minutes, off build's critical path); the checks take seconds.
  counters:
    needs: select
    if: ${{ needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: counters
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/test-counters.py
      - run: python3 scripts/counters.py build
      - name: Counter gate
        run: python3 scripts/counters.py check | tee -a "$GITHUB_STEP_SUMMARY"

  corpora:
    name: corpora (${{ matrix.group }}, ${{ matrix.shard }}${{ matrix.tier && format(', {0}', matrix.tier) || '' }})
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The six small corpora take ~2 minutes of work together, as much
        # as one job's setup took for each of them alone, so they share a
        # job: 20 jobs became 10, without lengthening the run (FastR's
        # shards take longer). `group` names the job and the artifact.
        include:
          - { group: small, corpora: gnur-tests gnur-examples gnur-demos r-intro cran-purer capi, shard: "1/1" }
          - { group: fastr, corpora: fastr, shard: "1/4" }
          - { group: fastr, corpora: fastr, shard: "2/4" }
          - { group: fastr, corpora: fastr, shard: "3/4" }
          - { group: fastr, corpora: fastr, shard: "4/4" }
          # The same cases in the bytecode VM without the JIT (the top tier
          # on wasm32), against the same ratchet: `corpus.py run --tier`.
          - { group: small, corpora: gnur-tests gnur-examples gnur-demos r-intro cran-purer capi, shard: "1/1", tier: vm }
          - { group: fastr, corpora: fastr, shard: "1/4", tier: vm }
          - { group: fastr, corpora: fastr, shard: "2/4", tier: vm }
          - { group: fastr, corpora: fastr, shard: "3/4", tier: vm }
          - { group: fastr, corpora: fastr, shard: "4/4", tier: vm }
    container:
      image: ${{ needs.select.outputs.image_base }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - name: Run ${{ matrix.group }} (${{ matrix.shard }}${{ matrix.tier && format(', {0}', matrix.tier) || '' }})
        env:
          CORPORA: ${{ matrix.corpora }}
          SHARD: ${{ matrix.shard }}
          TIER: ${{ matrix.tier }}
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export ROBIGO_RDBFLAT="$PWD/dist/rdbflat"
          tier=()
          if [ -n "$TIER" ]; then tier=(--tier "$TIER"); fi
          # every corpus runs even after one fails; any failure fails the job
          status=0
          for corpus in $CORPORA; do
            python3 scripts/corpus.py run "$corpus" --shard "$SHARD" "${tier[@]}" \
              --robigo dist/robigo --jobs "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit $status
      - name: Name the results
        if: always()
        run: echo "RESULT_NAME=corpus-${{ matrix.group }}-${{ matrix.shard }}${{ matrix.tier && format('-{0}', matrix.tier) || '' }}" | sed 's#/#of#' >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.RESULT_NAME }}
          path: .robigo/results/
          retention-days: 14

  # Mutated scripts and RDS files must never end the process
  # (scripts/fuzz.py). A fixed seed keeps a pull request from failing on
  # inputs its change has nothing to do with; main explores new ones.
  fuzz:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    # A run takes ~3 min: stop a hang long before GitHub's 6 h cap.
    timeout-minutes: 20
    container:
      image: ${{ needs.select.outputs.image_base }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - name: Parser and unserialize
        env:
          FUZZ_SEED: ${{ github.event_name == 'pull_request' && '0' || github.run_id }}
        run: |
          status=0
          for target in parse rds; do
            python3 scripts/fuzz.py "$target" --seconds 60 --jobs "$(nproc)" --robigo dist/robigo --seed "$FUZZ_SEED" \
              | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit $status
      # scripts/reduce.py and the parse-tree mutator and EMI it shares with
      # fuzz-eval, against a robigo stand-in (GNU R 4.5.0 only, no binary)
      - name: Reducer
        run: python3 scripts/test-reduce.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: .robigo/fuzz

  # CRAN packages with compiled code (tests/cran/packages.tsv), installed
  # from source with robigo's own R_HOME and compared with GNU R 4.5.0's
  # recorded result (scripts/cran-gate.py; docs/verification.md).
  cran:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    # A backstop only: above the steps' own limits with every package hanging.
    # That is 25 min per package plus setup, so raise it as packages.tsv grows.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_base }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      # The gate installs from source, so robigo needs its own R_HOME
      # (bin/R, etc/Makeconf, include/, lib/libR.so). robigo looks for it at
      # <exe>/../home: dist/robigo means $PWD/home.
      - name: robigo's R_HOME
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          scripts/robigo-home.sh "$(R RHOME)" dist/robigo home
      - name: Run the CRAN gate
        run: |
          python3 scripts/test-cran-gate.py
          python3 scripts/test-package-suite.py
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export ROBIGO_RDBFLAT="$PWD/dist/rdbflat"
          ROBIGO=dist/robigo python3 scripts/cran-gate.py run | tee -a "$GITHUB_STEP_SUMMARY"

  # User-level package scripts (tests/packages/smoke), transcript-checked
  # against GNU R's recordings on the package suite's pinned library:
  # minutes, on every pull request, where the block suites are nightly.
  # A marked case that stops matching fails here (scripts/package-suite.py
  # smoke; docs/verification.md).
  smoke:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_packages }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Workers run in a network namespace of their own (unshare -n).
      # No --add-host list: smoke cases use no test server.
      options: --cap-add=SYS_ADMIN --cap-add=NET_ADMIN
    env:
      ROBIGO_PKG_ORACLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      # The pinned library, sources and rv, keyed by the lock and the
      # system libraries: sync() is idempotent, and a 504 on the rv
      # download used to flake every job that installs it. Main saves them
      # at the end of the job (package-cache mode: save).
      - uses: ./.github/actions/package-cache
        with:
          mode: restore
      - uses: ./.github/actions/package-suite
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - name: robigo's R_HOME
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          scripts/robigo-home.sh "$(R RHOME)" dist/robigo home
      - name: Run the smoke tier
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives" ROBIGO_RDBFLAT="$PWD/dist/rdbflat" ROBIGO="$PWD/dist/robigo"
          python3 scripts/package-suite.py smoke --out out/smoke.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: smoke
          path: out
          if-no-files-found: ignore
      - uses: ./.github/actions/package-cache
        with:
          mode: save

  # PRs that change the binary's behaviour: run every block the ratchet
  # already covers (tests/packages/passing/), sharded, and fail on REGRESSED
  # markers only. The library is restored from cache; the job runs in
  # parallel with perf and must not become the critical path.
  # Transitional: main currently has pre-existing package regressions being
  # fixed on another track; until that lands, this gate can flag those same
  # regressions on PRs based on main. It is correct once main is green.
  package-gate:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' && needs.select.outputs.runtime == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_packages }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add=SYS_ADMIN --cap-add=NET_ADMIN --add-host=httpbin.org:127.0.0.1
    env:
      ROBIGO_PKG_ORACLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      # The pinned library, sources and rv, keyed by the lock and the
      # system libraries: sync() is idempotent, and a 504 on the rv
      # download used to flake every job that installs it. Main saves them
      # at the end of the job (package-cache mode: save).
      - uses: ./.github/actions/package-cache
        with:
          mode: restore
      - uses: ./.github/actions/package-suite
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - name: robigo's R_HOME
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          scripts/robigo-home.sh "$(R RHOME)" dist/robigo home
      - name: Package regression gate (${{ matrix.shard }}/${{ strategy.job-total }})
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives" ROBIGO_RDBFLAT="$PWD/dist/rdbflat" ROBIGO="$PWD/dist/robigo"
          python3 scripts/test-package-suite.py
          python3 scripts/package-suite.py run --ratchet-only --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
            --out "out/package-gate.shard${{ matrix.shard }}.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: package-gate-${{ matrix.shard }}
          path: out
          if-no-files-found: ignore

  perf:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_base }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # perf-baseline.py may wait 50 minutes for main's run, then this measures
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's test merge commit and both its parents: the diff
          # against main's commit (HEAD^1) is what scripts/perf-select.py maps
          # to benchmarks.
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - run: python3 scripts/perf.py fetch
      - name: Select benchmarks
        id: select
        # Pull requests run only the benchmarks their changed paths can
        # affect (benchmarks/selection.toml); main, dispatches and anything
        # the mapping does not cover run all of them. The gate is unchanged.
        run: |
          python3 scripts/test-callgrind-diff.py
          python3 scripts/test-perf-select.py
          python3 scripts/test-history.py
          python3 scripts/perf-select.py --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fetch baseline from main
        if: github.ref != 'refs/heads/main' && steps.select.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The PR's merge commit is built on main's commit HEAD^1 (its first
          # parent, read from the commit object, which the shallow checkout
          # has): compare with that commit's numbers, not with whichever main
          # run finished last (main may have moved since, or that commit's
          # run may still be going: perf-baseline.py waits for it).
          base=$(git -c safe.directory='*' cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          python3 scripts/perf-baseline.py "$base" base --binary | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Measure robigo (and GNU R on main)
        if: steps.select.outputs.run == 'true'
        env:
          # Empty: every benchmark. Only pull requests get a filter.
          PERF_FILTER: ${{ steps.select.outputs.filter }}
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export ROBIGO_RDBFLAT=""
          export VALGRIND=valgrind
          filter_flag=()
          if [ -n "$PERF_FILTER" ]; then filter_flag=(--filter "$PERF_FILTER"); fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python3 scripts/perf.py run --metric instr --runtime both --robigo dist/robigo \
              --jobs "$(nproc)" --out perf.json --quiet "${filter_flag[@]}"
          else
            oracle_flag=""
            runtime="robigo"
            if [ -f base/perf.json ]; then
              oracle_flag="--oracle base/perf.json"
            else
              runtime="both"
            fi
            python3 scripts/perf.py run --metric instr --runtime "$runtime" $oracle_flag --robigo dist/robigo \
              --jobs "$(nproc)" --out perf.json --quiet "${filter_flag[@]}"
          fi
      - name: "Diagnostic: rdbflat win"
        if: github.ref == 'refs/heads/main'
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export VALGRIND=valgrind
          python3 scripts/perf-paired.py --diagnostic-only --robigo dist/robigo --rdbflat dist/rdbflat | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare with main
        if: github.ref != 'refs/heads/main' && steps.select.outputs.run == 'true'
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export ROBIGO_RDBFLAT=""
          if [ ! -f base/perf.json ]; then exit 0; fi
          python3 - <<'PY'
          import json
          # Ensure GNU R's counts and outputs come from baseline if not already attached.
          b = json.load(open("base/perf.json")); n = json.load(open("perf.json"))
          updated = False
          for k, v in n["results"].items():
              if "gnur" not in v and "gnur" in b["results"].get(k, {}):
                  v["gnur"] = b["results"][k]["gnur"]
                  updated = True
          if updated:
              json.dump(n, open("perf.json", "w"), indent=1, sort_keys=True)
          PY
          python3 scripts/perf.py report perf.json --markdown >> "$GITHUB_STEP_SUMMARY"
          # Compare flagged regressions with both exact executables and the
          # cache disabled. Cache wins are diagnostic only. Preserve original
          # measurements and profiles; the 0.5% threshold is unchanged.
          python3 scripts/test-perf-paired.py
          python3 scripts/perf-paired.py base/perf.json perf.json \
            --base-robigo base/binary/robigo --robigo dist/robigo \
            --rdbflat dist/rdbflat | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/perf.py report perf.json --markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && github.ref != 'refs/heads/main' && steps.select.outputs.run == 'true'
        with:
          name: perf-paired-profiles
          path: .robigo/perf-paired
      - uses: actions/upload-artifact@v7
        if: steps.select.outputs.run == 'true'
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'perf-main' || 'perf' }}
          path: perf.json
          retention-days: 90

  # Branch protection requires this job, `Check`, and nothing else, so
  # adding, splitting or resharding jobs needs no ruleset change: add every
  # new gating job to `needs`. It passes when each job passed, or was skipped
  # because `select` said so; a failed, cancelled or unexplained skip fails
  # it. `always()`: a skipped required check counts as passing, so a
  # cancelled run must still report a failure here.
  check:
    name: Check
    if: ${{ always() }}
    needs: [select, lint, miri, rt, build, release-tests, test, bytecode-fidelity, counters, corpora, fuzz, cran, smoke, package-gate, perf]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github/workflows
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' && '--pull-request' || '' }}
        run: |
          python3 scripts/test-ci-check.py 2>&1 | tail -1
          python3 scripts/ci-check.py $PULL_REQUEST

  progress:
    # main only: record this commit's speed and compatibility on the orphan
    # branch progress-data and publish the README's charts and badges on
    # GitHub Pages (scripts/history.py, docs/verification.md). `sync`
    # also records earlier main runs the history lacks.
    needs: [build, test, corpora, perf, smoke]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 15
    concurrency:
      group: progress
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git gh python3 ca-certificates > /dev/null
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Record on progress-data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            rm -rf data && git worktree prune
            git fetch -q --depth 1 origin +refs/heads/progress-data:refs/remotes/origin/progress-data
            git worktree add -q --detach data origin/progress-data
            python3 scripts/history.py add data/history.jsonl artifacts --commit "$GITHUB_SHA" \
              --run "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
            python3 scripts/history.py sync data/history.jsonl --repo "$GITHUB_REPOSITORY" --limit 20 ||
              echo "::warning::history sync failed; recording this commit only"
            git -C data add history.jsonl
            if git -C data diff --cached --quiet; then break; fi
            git -C data commit -q -m "history: ${GITHUB_SHA::12}"
            if git -C data push -q origin HEAD:refs/heads/progress-data; then break; fi
            if [ "$try" = 5 ]; then exit 1; fi
            sleep $((try * 5))   # another run pushed first: redo on top of it
          done
      - name: Check for slow perf creep
        # Not a gate: main stays green. The pull-request gate allows 0.5% per
        # benchmark per pull request; this compares main's instruction counts
        # with the median of the runs before and with the run a week back
        # (scripts/history.py check). A regression the run before did not
        # show opens an issue labelled perf-regression, or comments on the
        # open one.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/perf-creep.md"
          python3 scripts/history.py check data/history.jsonl --commit "$GITHUB_SHA" --report "$report" \
            --repo "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          [ -s "$report" ] || exit 0
          # First, so a failed gh call below cannot lose the alert.
          echo "::warning::main got slower past the noise band: see the run summary and the perf-regression issue"
          gh label create perf-regression -R "$GITHUB_REPOSITORY" --color B60205 --force \
            --description "main got slower than its recent runs or its run a week back"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label perf-regression --state open --json number \
            --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body-file "$report"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label perf-regression --body-file "$report" \
              --title "Perf creep on main at ${GITHUB_SHA::10}"
          fi
      - run: python3 scripts/history.py render data/history.jsonl --out site --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
