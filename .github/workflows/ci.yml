# Every push and pull request: build, unit tests and conformance, the test
# corpora with their ratchets, and the performance gate. See
# docs/verification.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  LANGUAGE: en
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  build:
    runs-on: ${{ vars.ROBIGO_RUNNER || 'ubuntu-24.04' }}
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git > /dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --release --workspace
      - name: Unit tests, parser oracle, conformance (all tiers)
        run: cargo test --release --workspace
      - name: Core and C API under gctorture (collect on every allocation)
        run: ROBIGO_GCTORTURE=1 cargo test --release -p robigo-core -p robigo-capi
      - name: Parse corpus ratchet
        run: |
          python3 scripts/parse-corpus.py check fastr gnur-tests gnur-examples | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the binary for later jobs
        run: |
          mkdir -p dist
          cp "$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/robigo" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: robigo
          path: dist/robigo
          retention-days: 7

  corpora:
    needs: build
    runs-on: ${{ vars.ROBIGO_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { corpus: gnur-tests, shard: "1/1" }
          - { corpus: gnur-examples, shard: "1/1" }
          - { corpus: gnur-demos, shard: "1/1" }
          - { corpus: r-intro, shard: "1/1" }
          - { corpus: cran-purer, shard: "1/1" }
          - { corpus: capi, shard: "1/1" }
          - { corpus: fastr, shard: "1/4" }
          - { corpus: fastr, shard: "2/4" }
          - { corpus: fastr, shard: "3/4" }
          - { corpus: fastr, shard: "4/4" }
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git > /dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v4
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - name: Run ${{ matrix.corpus }} (${{ matrix.shard }})
        run: |
          python3 scripts/corpus.py run ${{ matrix.corpus }} --shard ${{ matrix.shard }} \
            --robigo dist/robigo --jobs "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Name the results
        if: always()
        run: echo "RESULT_NAME=corpus-${{ matrix.corpus }}-${{ matrix.shard }}" | sed 's#/#of#' >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.RESULT_NAME }}
          path: .robigo/results/
          retention-days: 14

  perf:
    needs: build
    runs-on: ${{ vars.ROBIGO_RUNNER || 'ubuntu-24.04' }}
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git > /dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v4
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - run: python3 scripts/perf.py fetch
      - name: Measure robigo (and GNU R on main)
        run: |
          export VALGRIND=valgrind
          runtime=robigo
          [ "${{ github.ref }}" = refs/heads/main ] && runtime=both
          python3 scripts/perf.py run --metric instr --runtime $runtime --robigo dist/robigo \
            --jobs "$(nproc)" --out perf.json --quiet
      - name: Compare with main
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
                 --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$id" ]; then echo "no baseline on main yet"; exit 0; fi
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n perf-main -D base
          python3 - <<'PY'
          import json
          # GNU R's counts come from main's run on the same runner image.
          b = json.load(open("base/perf.json")); n = json.load(open("perf.json"))
          for k, v in n["results"].items():
              if "gnur" in b["results"].get(k, {}):
                  v["gnur"] = b["results"][k]["gnur"]
          json.dump(n, open("perf.json", "w"))
          PY
          python3 scripts/perf.py report perf.json --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/perf.py compare base/perf.json perf.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/perf.py report perf.json --markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'perf-main' || 'perf' }}
          path: perf.json
          retention-days: 90

  progress:
    # main only: record this commit's speed and compatibility on the orphan
    # branch progress-data and publish the README's charts and badges on
    # GitHub Pages (scripts/history.py, docs/verification.md). `sync`
    # also records earlier main runs the history lacks.
    needs: [build, corpora, perf]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    runs-on: ${{ vars.ROBIGO_RUNNER || 'ubuntu-24.04' }}
    container: debian:trixie
    concurrency:
      group: progress
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git gh python3 ca-certificates > /dev/null
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Record on progress-data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            rm -rf data && git worktree prune
            git fetch -q --depth 1 origin +refs/heads/progress-data:refs/remotes/origin/progress-data
            git worktree add -q --detach data origin/progress-data
            python3 scripts/history.py add data/history.jsonl artifacts --commit "$GITHUB_SHA" \
              --run "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
            python3 scripts/history.py sync data/history.jsonl --repo "$GITHUB_REPOSITORY" --limit 20
            git -C data add history.jsonl
            if git -C data diff --cached --quiet; then break; fi
            git -C data commit -q -m "history: ${GITHUB_SHA::12}"
            if git -C data push -q origin HEAD:refs/heads/progress-data; then break; fi
            if [ "$try" = 5 ]; then exit 1; fi
            sleep $((try * 5))   # another run pushed first: redo on top of it
          done
      - run: python3 scripts/history.py render data/history.jsonl --out site --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
