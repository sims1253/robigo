# EXPERIMENT (throwaway, not for merge): is a benchmark's callgrind count
# the same on every GitHub runner? One fixed binary (main 45b4dd2's CI
# artifact), several runners, mimalloc purging on and off.
name: ci
on:
  pull_request:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  LANGUAGE: en
  LC_ALL: C.UTF-8
  TZ: UTC
jobs:
  probe:
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        k: [1, 2, 3, 4]
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git > /dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - name: binary of main 45b4dd2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40684403456 -R "$GITHUB_REPOSITORY" -n robigo -D dist && chmod +x dist/robigo
      - run: python3 scripts/perf.py fetch
      - name: cpu
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(erms|fsrm|avx2|avx512f|avx512bw|avx512vl|rtm|bmi2)$' | tr '\n' ' '; echo
          nproc
      - name: counts
        run: |
          export VALGRIND=valgrind
          for mode in default purge-off; do
            for i in 1 2; do
              if [ $mode = purge-off ]; then export MIMALLOC_PURGE_DELAY=-1; else unset MIMALLOC_PURGE_DELAY; fi
              python3 scripts/perf.py run --metric instr --runtime robigo --robigo dist/robigo \
                --filter 'binarytrees_naive$|shootout/binarytrees$|robigo/fib$|knucleotide$' --jobs 2 --out p.json --quiet > /dev/null
              python3 -c "import json; d=json.load(open('p.json'))['results']; print('$mode', $i, ' '.join(f\"{k.split('/')[-1]}={v['robigo']['instr']}\" for k,v in sorted(d.items())))"
            done
          done
      - name: profile
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, 'scripts'); import perf
          p = perf.programs(perf.conf(), None, 'binarytrees_naive$')[0]
          open('bt.R', 'w').write(p[2])
          PY
          R_DEFAULT_PACKAGES=utils,stats valgrind --tool=callgrind --callgrind-out-file=cg.out dist/robigo --vanilla bt.R > /dev/null 2>&1
          callgrind_annotate --threshold=100 --auto=no cg.out | sed -n '1,40p' | grep -E 'TOTALS|mem|str|mi_|malloc' | head -20
