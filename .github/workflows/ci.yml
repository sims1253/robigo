# Every push and pull request: build, unit tests and conformance, the test
# corpora with their ratchets, and the performance gate. See
# docs/verification.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's runs share one group, `ci-pr-<number>`, with
# cancel-in-progress: a new push cancels the pull request's older run at
# once, before any runner is free, so its heavy jobs stop taking runners.
# (Until 2026-11-21 the cancel was `select`'s first step, which ran only when
# the new run got its first runner: in a full pool both runs kept queueing
# until then.) The cancelled run's `Check` still runs (`always()`) and fails
# on its cancelled needs (what it certifies: the `check` job's comment), and
# holds the group until it has had a runner: the new run waits that long, as
# it waited for `select` before. A re-run of a superseded run re-enters
# `ci-pr-<number>` and cancels the run in progress: re-run only the newest.
#
# Main's push runs share one group, `ci-main`. Without cancel-in-progress,
# GitHub keeps the run in progress and at most one pending: a newer push
# replaces the pending run, so a burst of merges runs the newest commit
# next, and the group never cancels a started run. (Until 2026-11-21 every
# main commit had a group of its own, because its run published the perf
# baseline that pull requests compared with; since #901 a pull request's
# perf measures its own base, and no pull request reads that baseline. On
# 2026-11-21 one merge every 15.5 minutes queued main runs hours behind.)
# What still reads main's runs needs a recent completed run, not every
# commit: the progress history (scripts/history.py records each completed
# run), the nightly packages binary (the newest successful run's), and the
# caches only main saves. What a skipped commit loses: its point in the
# history, and a breakage on main names a range of commits, not one.
#
# A manual dispatch has a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'push' && 'main' || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  packages: read

# bash with pipefail (GitHub runs `bash -eo pipefail` for `shell: bash`):
# the default `sh -e` takes a pipeline's status from its last command, so
# `corpus.py run ... | tee` passed even when the ratchet failed.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  LANGUAGE: en
  LC_ALL: C.UTF-8
  TZ: UTC

# Caches: only main saves (rust-cache `save-if`, actions/cache/save). A pull
# request's entry is readable by that pull request alone, and those entries
# filled half of the 10 GB cache and evicted main's (docs/ledger/test-infra.md).

jobs:
  # PRs that cannot change the binary's behaviour skip the build-dependent
  # heavy jobs (scripts/ci-select.py). main always runs everything.
  # It also makes sure the CI image (.github/ci-image) for this tree exists:
  # building and pushing it when the inputs changed, a few minutes once,
  # instead of every job installing R and Rust (~35 s each, ~33 jobs a run).
  # The GNU R 4.6.2 oracle image (oracle.Dockerfile) compiles R; it has
  # inputs of its own and rebuilds only when they change.
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      heavy: ${{ steps.sel.outputs.heavy }}
      mode: ${{ steps.sel.outputs.mode }}
      runtime: ${{ steps.sel.outputs.runtime }}
      rt: ${{ steps.sel.outputs.rt }}
      stacked: ${{ steps.sel.outputs.stacked }}
      image_base: ${{ steps.image.outputs.base }}
      image_rust: ${{ steps.image.outputs.rust }}
      image_packages: ${{ steps.image.outputs.packages }}
      # One output per oracle image: scripts/ci-image.sh prints
      # `oracle_<version>` (dots as underscores) for each version in its
      # `oracles=(...)`. A version added there needs its line here.
      image_oracle_4_6_2: ${{ steps.image.outputs.oracle_4_6_2 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select jobs
        id: sel
        run: |
          python3 scripts/test-ci-select.py
          python3 scripts/ci-select.py --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      - name: CI image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin > /dev/null
          scripts/ci-image.sh ensure | tee -a "$GITHUB_OUTPUT"

  # Seconds of work: a formatting or lint mistake should not wait for a build.
  lint:
    needs: select
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: scripts/lint.sh
      - name: Corpus, oracle, Sexp-check and wall-time tooling
        run: |
          python3 scripts/test_corpus.py
          python3 scripts/test-oracle-diff.py
          python3 scripts/test-check-sexp-safety.py
          python3 scripts/test-wall13.py
          python3 scripts/test-pgo-build.py
      - name: Target pruning
        run: python3 scripts/test-prune-target.py
      - name: Temporary directories (scripts/scratch.py and its tools)
        run: python3 scripts/test-scratch.py

  miri:
    # (after select only for its `stacked`: a stacked pull request skips it)
    needs: select
    if: ${{ needs.select.outputs.stacked != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # one toolchain for every Miri step below (each step stands alone)
      - name: Miri toolchain
        run: rustup toolchain install nightly-2026-11-02 --profile minimal --component miri,rust-src
      - name: Miri on RString and the Rc alias writes
        run: cargo +nightly-2026-11-02 miri test --locked -p robigo-runtime --lib -- 'value::'
      # G3's object API (docs/g3.md §2.2): the isolate's cells, scopes, roots,
      # re-entry and the heap's allocation; not the value stack's mmap (an
      # allocator stands in) or collections (the heap's C shim). It adds about
      # 11 s to the job (1 min 45 s cold, PR #642), well inside the timeout.
      - name: Miri on the rt-core facade
        run: cargo +nightly-2026-11-02 miri test --locked -p robigo-rtcore
      # robigo-heap's tests that call no C (G3 M2, H4): the layout's
      # definitions, its no-overlap checks and #[repr(C)] views, the block
      # bitmaps, the size classes, and the symbol arena's threads interning
      # at once (H5). The collector's tests need the C shim.
      - name: Miri on the heap's layout and bitmaps
        run: cargo +nightly-2026-11-02 miri test --locked -p robigo-heap --lib -- 'layout::' 'heap::bitmap_tests' 'heap::medium_tests' 'arena::' 'gc::freeze'

  # G3's runtime crates (docs/g3.md §14.1, §16): their tests, then the
  # same under gctorture; the verification modes add steps as they land.
  # Every pull request but a docs-only one runs it. One that touches only
  # those crates (`rt` mode) runs this instead of the heavy jobs:
  # scripts/rt-ci.py first checks that the robigo binary does not link them.
  # L1's byte-exactness bar's data (crates/robigo-rt/tests/rdb_roundtrip.rs):
  # GNU R 4.6.2's own base, compiler and tools databases with GNU R's round
  # trip of each record, made in the oracle image (scripts/rt-rdb-roundtrip.sh
  # --data-only: its GNU R is the R on PATH) and cached per image and script,
  # saved on main only, as every cache here; a pull request that misses
  # makes them and hands them to the rt job as an artifact. The rt job
  # restores them; a container job cannot run docker, and the Rust image has
  # no GNU R 4.6.2.
  rdb-data:
    needs: select
    if: ${{ needs.select.outputs.rt == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_oracle_4_6_2 }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - name: The data's cache key
        id: key
        env:
          IMAGE: ${{ needs.select.outputs.image_oracle_4_6_2 }}
        run: |
          image=$(printf '%s' "$IMAGE" | sha256sum | cut -c1-16)
          echo "key=rdb-oracle-1-$image-${{ hashFiles('scripts/rt-rdb-roundtrip.sh', 'scripts/lazyload-ck.R') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: data
        with:
          path: .robigo/oracle-lib
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: GNU R's databases and their round trip
        if: steps.data.outputs.cache-hit != 'true'
        run: scripts/rt-rdb-roundtrip.sh --data-only .robigo/oracle-lib
      - uses: actions/cache/save@v6
        if: steps.data.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: .robigo/oracle-lib
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@v7
        if: steps.data.outputs.cache-hit != 'true' && github.ref != 'refs/heads/main'
        with:
          name: rdb-oracle-lib
          path: .robigo/oracle-lib
          retention-days: 1

  # A4's GNU R side (scripts/builtin-diff.py): each row's cases, made and run
  # by GNU R 4.6.2 in the oracle image, cached by a hash of everything they
  # depend on (`builtin-diff.py key`), so the rt job compares robigo-rt's
  # records with them. Each case runs under a 2 GiB address-space cap.
  builtin-diff-data:
    needs: select
    if: ${{ needs.select.outputs.rt == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_oracle_4_6_2 }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # (measured: about 8 minutes cold here, most of it the External rows'
    # one process per case, each batch run twice)
    timeout-minutes: 40
    env:
      ROBIGO_BUILTIN_DIFF_ORACLE: ${{ needs.select.outputs.image_oracle_4_6_2 }}
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      # names.c's columns: the rows' arity and kind come from GNU R's sources
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - name: The records' cache key
        id: key
        run: |
          k=$(python3 scripts/builtin-diff.py key)
          echo "key=builtin-diff-1-$k" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: data
        with:
          path: .robigo/builtin-diff-data
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: GNU R's records for every row
        if: steps.data.outputs.cache-hit != 'true'
        run: python3 scripts/builtin-diff.py oracle --all --data .robigo/builtin-diff-data
      - uses: actions/cache/save@v6
        if: steps.data.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: .robigo/builtin-diff-data
          key: ${{ steps.key.outputs.key }}
      # One file, not the records themselves: the artifact client zips its
      # files on the fly, and with 76 rows' 84,770 records it stalled
      # ("Upload progress stalled", run 44263394134). The records are
      # compressed RDS already, so the tar is stored as it is.
      - name: Pack the records
        if: steps.data.outputs.cache-hit != 'true' && github.ref != 'refs/heads/main'
        run: tar -C .robigo -cf builtin-diff-data.tar builtin-diff-data
      - uses: actions/upload-artifact@v7
        if: steps.data.outputs.cache-hit != 'true' && github.ref != 'refs/heads/main'
        with:
          name: builtin-diff-data
          path: builtin-diff-data.tar
          compression-level: 0
          retention-days: 1

  # G3's runtime crates: scripts/rt-ci.py's steps in six jobs, one shard
  # each (rt-ci.py's SHARDS, which says what each runs), built in each job
  # and run in parallel. One job ran them all until 2026-11-21, in 29-38
  # minutes against a 40-minute limit (docs/ledger/g3/2026-11-21-a1-rt-shards.md).
  # Each job's timeout is max(2 × its shard's budget, 20) minutes
  # (rt-ci.py's BUDGETS and TIMEOUT_FLOOR, pinned by scripts/test-rt-ci.py); each prints its steps' times at the
  # end of its log, with a warning at 90% of the budget. `Check` needs all.
  #
  # rt: the crates' tests (quick profile) and every mode they run under, the
  # conformance and its short modes, stress, overshoot, E9, the byte-code
  # crosscheck; then L1's rdb round trip.
  rt:
    needs: [select, rdb-data]
    if: ${{ needs.select.outputs.rt == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rt
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # GNU R 4.6.2's pinned sources: robigo-rt binds base's R code from
      # them (crates/robigo-rt/src/base.rs). The tarball is cached;
      # scripts/r-src.sh checks its sha256 and extracts it.
      - uses: actions/cache/restore@v6
        id: rsrc462
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.rsrc462.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: rt-ci.py, shard modes
        env:
          RT_CI_TIMES_DIR: ${{ runner.temp }}/rt-case-times
        run: |
          python3 scripts/test-rt-ci.py
          python3 scripts/rt-ci.py --shard modes
      # L1's bar, outside rt-ci's gctorture modes (its 2,440 records): every
      # record of GNU R's base, compiler and tools databases round-trips as
      # GNU R's does. The test fails when the variable is set and a file is
      # missing, and the artifact's download fails when neither has the data.
      # each conformance case's wall time (rt-ci.py's TIMES_DIR), for the
      # slow-case rule and the shards' balance; failed runs too
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rt-case-times-modes
          path: ${{ runner.temp }}/rt-case-times
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/cache/restore@v6
        id: rdb
        with:
          path: .robigo/oracle-lib
          key: ${{ needs.rdb-data.outputs.key }}
      # a pull request whose rdb-data missed main's cache made the data itself
      - uses: actions/download-artifact@v7
        if: steps.rdb.outputs.cache-hit != 'true'
        with:
          name: rdb-oracle-lib
          path: .robigo/oracle-lib
      # with V3's test: every closure of base.rdb translated; its closures
      # also compared with the from-source compiler's code, reported only
      # (docs/ledger/g3/2026-11-17-v3-bcodesxp-ir.md)
      # (the classes' counts printed whether the test passes or not: they
      # matter most when it fails; the step keeps the test's status)
      - name: GNU R's lazy-load databases (rdb_roundtrip, base.rdb's closures translated; lazyload)
        run: |
          report="$RUNNER_TEMP/bc-crosscheck-base.txt"
          status=0
          ROBIGO_ORACLE_LIBRARY="$PWD/.robigo/oracle-lib" ROBIGO_BC_CROSSCHECK=1 ROBIGO_BC_CROSSCHECK_REPORT="$report" \
            cargo test --profile quick --locked -p robigo-rt --test rdb_roundtrip -- --nocapture || status=$?
          # (L4's makeLazy: base's lazyLoad of the same databases, through the binary)
          ROBIGO_ORACLE_LIBRARY="$PWD/.robigo/oracle-lib" \
            cargo test --release --locked -p robigo-rtapi --test lazyload -- --nocapture || status=$?
          if [ -f "$report" ]; then sed 's/: .*//' "$report" | sort | uniq -c; fi
          exit "$status"


  # the two long conformance runs under gctorture, plain and with
  # GC_MOVE=young:16: a conformance build only (the crates' tests, GC_MOVE's
  # included, run in rt, which builds them anyway)
  rt-gctorture:
    needs: select
    if: ${{ needs.select.outputs.rt == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 54
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rt
          # (rt saves this cache; two jobs saving one key would race)
          save-if: false
      # GNU R 4.6.2's pinned sources: robigo-rt binds base's R code from
      # them (crates/robigo-rt/src/base.rs). The tarball is cached;
      # scripts/r-src.sh checks its sha256 and extracts it.
      - uses: actions/cache/restore@v6
        id: rsrc462
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - name: rt-ci.py, shard gctorture
        env:
          RT_CI_TIMES_DIR: ${{ runner.temp }}/rt-case-times
        run: python3 scripts/rt-ci.py --shard gctorture
      # each conformance case's wall time (rt-ci.py's TIMES_DIR), for the
      # slow-case rule and the shards' balance; failed runs too
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rt-case-times-gctorture
          path: ${{ runner.temp }}/rt-case-times
          if-no-files-found: ignore
          retention-days: 14

  # the crates' tests (quick profile) and the conformance (release) with
  # `-C debug-assertions=on` (heap's debug_assert!s seeing compiled code:
  # how H found compile.rs's `@<-` inline bug), a build of its own
  rt-debug-assertions:
    needs: select
    if: ${{ needs.select.outputs.rt == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # its own build (RUSTFLAGS) in its own target directory
          # (rt-ci.py's debug_assertions_steps), so a cache of its own
          key: rt-debug-assertions
          workspaces: ". -> target-debug-assertions"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # GNU R 4.6.2's pinned sources: robigo-rt binds base's R code from
      # them (crates/robigo-rt/src/base.rs). The tarball is cached;
      # scripts/r-src.sh checks its sha256 and extracts it.
      - uses: actions/cache/restore@v6
        id: rsrc462
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - name: rt-ci.py, shard debug-assertions
        env:
          RT_CI_TIMES_DIR: ${{ runner.temp }}/rt-case-times
        run: python3 scripts/rt-ci.py --shard debug-assertions
      # each conformance case's wall time (rt-ci.py's TIMES_DIR), for the
      # slow-case rule and the shards' balance; failed runs too
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rt-case-times-debug-assertions
          path: ${{ runner.temp }}/rt-case-times
          if-no-files-found: ignore
          retention-days: 14

  # the crates' tests on the full release profile (thin LTO, one codegen
  # unit), the code users get: every other shard builds them in the quick
  # profile. Not on pull requests: on main (and a manual dispatch), so a
  # codegen-dependent crate-test failure shows within one main run of its
  # merge (the accepted trade, docs/ledger/g3/2026-11-21-a1-rt-shards.md)
  rt-release-crate-tests:
    needs: select
    if: ${{ needs.select.outputs.rt == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rt
          # (rt saves this cache; two jobs saving one key would race)
          save-if: false
      # GNU R 4.6.2's pinned sources: robigo-rt binds base's R code from
      # them (crates/robigo-rt/src/base.rs). The tarball is cached;
      # scripts/r-src.sh checks its sha256 and extracts it.
      - uses: actions/cache/restore@v6
        id: rsrc462
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - name: rt-ci.py, shard release-crate-tests
        run: python3 scripts/rt-ci.py --shard release-crate-tests

  # retry-torture's conformance (robigo-rtcore/retry-torture), then in its
  # build (CHECK_FEATURES) the poison-dead steps (robigo-rt/poison-dead)
  rt-feature-builds:
    needs: select
    if: ${{ needs.select.outputs.rt == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rt
          # (rt saves this cache; two jobs saving one key would race)
          save-if: false
      # GNU R 4.6.2's pinned sources: robigo-rt binds base's R code from
      # them (crates/robigo-rt/src/base.rs). The tarball is cached;
      # scripts/r-src.sh checks its sha256 and extracts it.
      - uses: actions/cache/restore@v6
        id: rsrc462
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - name: rt-ci.py, shard feature-builds
        env:
          RT_CI_TIMES_DIR: ${{ runner.temp }}/rt-case-times
        run: python3 scripts/rt-ci.py --shard feature-builds
      # each conformance case's wall time (rt-ci.py's TIMES_DIR), for the
      # slow-case rule and the shards' balance; failed runs too
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rt-case-times-feature-builds
          path: ${{ runner.temp }}/rt-case-times
          if-no-files-found: ignore
          retention-days: 14

  # A4's builtin differential with its planted divergences
  # (robigo-rtbuiltins/diff-plant), against builtin-diff-data's GNU R records
  rt-builtin-diff:
    needs: [select, builtin-diff-data]
    if: ${{ needs.select.outputs.rt == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rt
          # (rt saves this cache; two jobs saving one key would race)
          save-if: false
      # GNU R 4.6.2's pinned sources: robigo-rt binds base's R code from
      # them (crates/robigo-rt/src/base.rs). The tarball is cached;
      # scripts/r-src.sh checks its sha256 and extracts it.
      - uses: actions/cache/restore@v6
        id: rsrc462
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      # A4's GNU R records (builtin-diff-data): rt-ci.py's builtin
      # differential step compares robigo-rt's with them
      - uses: actions/cache/restore@v6
        id: bdiff
        with:
          path: .robigo/builtin-diff-data
          key: ${{ needs.builtin-diff-data.outputs.key }}
      - uses: actions/download-artifact@v7
        if: steps.bdiff.outputs.cache-hit != 'true'
        with:
          name: builtin-diff-data
          path: .robigo
      # (builtin-diff-data hands the records over as one tar)
      - name: Unpack A4's GNU R records
        if: steps.bdiff.outputs.cache-hit != 'true'
        run: tar -C .robigo -xf .robigo/builtin-diff-data.tar && rm .robigo/builtin-diff-data.tar
      - name: rt-ci.py, shard builtin-diff
        env:
          ROBIGO_BUILTIN_DIFF_DATA: ${{ github.workspace }}/.robigo/builtin-diff-data
          ROBIGO_BUILTIN_DIFF_ORACLE: ${{ needs.select.outputs.image_oracle_4_6_2 }}
        run: |
          python3 scripts/test-builtin-diff.py
          python3 scripts/rt-ci.py --shard builtin-diff

  # robigo-rt's base subset (crates/robigo-rt/proto/base-subset.txt and
  # base-bound.txt) is what scripts/base-subset.sh traces from this tree's
  # inputs on GNU R 4.6.2: run inside the oracle image, so the script calls
  # its Rscript directly. seccomp is off as in scripts/oracle-run.sh.
  base-subset:
    needs: select
    if: ${{ needs.select.outputs.rt == 'true' && needs.select.outputs.stacked != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_oracle_4_6_2 }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --security-opt seccomp=unconfined
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - name: The base subset is the one this tree generates
        run: |
          python3 scripts/test-base-subset-stale.py
          Rscript --vanilla scripts/test-base-subset-messages.R
          scripts/base-subset.sh --check
      # which scripts reach each name: the committed file leaves it out, so
      # that a new case changes it only where it reaches a new name
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: base-subset-reached-by
          path: |
            .robigo/base-subset/reached-by.txt
            .robigo/base-subset/*.diff
            .robigo/base-subset/mismatch-*.txt
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: select
    if: ${{ needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # (release-tests restores it)
          shared-key: release
          # shared-key drops the Cargo.lock hash from rust-cache's key, and
          # an exact-key hit skips the save: without it the entry would
          # never refresh after a dependency bump
          key: ${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked --workspace
      # GNU R's base-package natives built from the R 4.5.0 sources
      # (docs/core.md §8): robigo's dyn.load serves the base packages with
      # them instead of the Rust ports (ROBIGO_NATIVES)
      - uses: actions/cache/restore@v6
        id: rsrc
        with:
          path: ~/.cache/robigo-research/rsrc
          key: r-4.5.0-sources
      - name: Base-package natives
        run: |
          scripts/build-natives.sh stats splines tools parallel utils grDevices graphics grid
          echo "ROBIGO_NATIVES=$PWD/.robigo/natives" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.rsrc.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/robigo-research/rsrc
          key: r-4.5.0-sources
      # The flat lazy-load cache (rdbflat.rs): startup stops inflating a
      # zlib stream per lazyLoadDBfetch. Enumerate the actual .rdx keys.
      - name: Flat lazy-load cache
        run: |
          mkdir -p .robigo/bin
          cp "$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/robigo" .robigo/bin/robigo
          scripts/build-rdbflat.sh
          python3 scripts/test-rdbflat.py
      - name: Ratchet markers
        run: python3 scripts/ratchet.py check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Parse corpus ratchet
        run: |
          python3 scripts/parse-corpus.py check fastr gnur-tests gnur-examples | tee -a "$GITHUB_STEP_SUMMARY"
      # names.c builtins missing or of the wrong kind, and new "not
      # implemented yet" refusals, against the baseline (with its controls)
      - name: Builtin coverage drift
        run: python3 scripts/builtin-coverage.py --check .robigo/bin/robigo | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the binary for later jobs
        run: |
          mkdir -p dist/natives
          cp "$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/robigo" dist/
          # each base package's shared object, and grDevices' cairo module
          for d in .robigo/natives/*/; do
            p=$(basename "$d"); [ -f "$d$p.so" ] && mkdir -p "dist/natives/$p" && cp "$d"*.so "dist/natives/$p/"
          done
          cp -r .robigo/rdbflat dist/rdbflat
      - uses: actions/upload-artifact@v7
        with:
          name: robigo
          path: dist
          retention-days: 7

  # perf's base on a pull request: robigo and the base-package natives built
  # from the merge's base, HEAD^1, as `build` builds them, beside `build`.
  # `perf` measures it on its own runner instead of waiting for main's run of
  # that commit to publish `perf-main` (2026-11-18: a median 23 minutes on a
  # runner, 31 of 73 jobs cut off at 50 and compared with an ancestor:
  # docs/ledger/g3/2026-11-18-perf-base.md). Main does not run it.
  perf-base:
    needs: select
    if: ${{ needs.select.outputs.heavy == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # the merge commit and its parents: the base is HEAD^1
          fetch-depth: 2
      - name: The merge's base
        run: |
          git config --global --add safe.directory '*'
          git checkout -q --detach HEAD^1
          git log -1 --format='base: %H %s' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # build's cache: main's base is what it was built for
          shared-key: release
          key: ${{ hashFiles('Cargo.lock') }}
          save-if: false
      - name: Build
        run: cargo build --release --locked --workspace
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/robigo-research/rsrc
          key: r-4.5.0-sources
      - name: Base-package natives
        run: scripts/build-natives.sh stats splines tools parallel utils grDevices graphics grid
      - name: Keep the binary for perf
        run: |
          mkdir -p dist/natives
          cp "$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/robigo" dist/
          for d in .robigo/natives/*/; do
            p=$(basename "$d"); [ -f "$d$p.so" ] && mkdir -p "dist/natives/$p" && cp "$d"*.so "dist/natives/$p/"
          done
          git rev-parse HEAD > dist/BASELINE
      - uses: actions/upload-artifact@v7
        with:
          name: robigo-base
          path: dist
          retention-days: 7

  # The conservative stack scan's tests depend on frame layout, which
  # differs between profiles: the test job runs them under `quick`, this job
  # under the profile that ships (docs/ledger/core.md 2026-11-11). A job of
  # its own, off build's critical path: nothing waits for it.
  release-tests:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release
          key: ${{ hashFiles('Cargo.lock') }}
          # build saves the release dependencies; the test harnesses are
          # compiled here
          save-if: false
      - name: Core, C API and heap tests (release)
        run: cargo test --release --locked -p robigo-core -p robigo-capi -p robigo-heap

  # Compiling the test harnesses took 85% of this step when it ran inside
  # build at release settings, and every job below waited for it. Here they
  # build in the quick profile, and conformance tests the release binary.
  test:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      ROBIGO_CONF_BIN: ${{ github.workspace }}/dist/robigo
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: quick
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: |
          chmod +x dist/robigo
          echo "ROBIGO_NATIVES=$PWD/dist/natives" >> "$GITHUB_ENV"
      # GNU R 4.6.2's pinned sources: robigo-rt binds base's R code from
      # them (crates/robigo-rt/src/base.rs). The tarball is cached;
      # scripts/r-src.sh checks its sha256 and extracts it.
      - uses: actions/cache/restore@v6
        id: rsrc462
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.rsrc462.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: Unit tests, parser oracle, conformance (all tiers)
        # The conformance results go to the progress page with the corpora
        # (scripts/history.py records the open gaps from them).
        env:
          ROBIGO_CONF_RESULTS: ${{ github.workspace }}/.robigo/conformance-results/conformance.json
        run: cargo test --locked --profile quick --workspace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-conformance-1of1
          path: .robigo/conformance-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Core, C API and heap under gctorture (collect on every allocation)
        run: ROBIGO_GCTORTURE=1 cargo test --locked --profile quick -p robigo-core -p robigo-capi -p robigo-heap

  bytecode-fidelity:
    needs: select
    if: ${{ needs.select.outputs.stacked != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: bytecode-fidelity
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Bytecode metadata and encoding round trips
        run: cargo test --locked --profile quick -p robigo-runtime -p robigo-capi --features bytecode-fidelity
      - name: GNU bytecode fixtures in all three tiers
        run: |
          export ROBIGO_CONF_FILTER=tests/r/serialize/bytecode_
          ROBIGO_COMPILE=0 cargo test --locked --profile quick -p robigo-cli --features bytecode-fidelity --test conformance -- --exact conformance --nocapture
          ROBIGO_JIT=0 cargo test --locked --profile quick -p robigo-cli --features bytecode-fidelity --test conformance -- --exact conformance --nocapture
          cargo test --locked --profile quick -p robigo-cli --features bytecode-fidelity --test conformance -- --exact conformance --nocapture

  # Work counters on fixed loops (scripts/counters.py, docs/verification.md
  # "Counter gate"): vector copies, promises, environments, allocations, VM
  # ops and JIT deopts per iteration, held to tests/counters' bounds and the
  # shrink-only known list. Its own quick build with `--features counters`
  # (a few minutes, off build's critical path); the checks take seconds.
  counters:
    needs: select
    if: ${{ needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: counters
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/test-counters.py
      - run: python3 scripts/counters.py build
      - name: Counter gate
        run: python3 scripts/counters.py check | tee -a "$GITHUB_STEP_SUMMARY"

  corpora:
    name: corpora (${{ matrix.group }}, ${{ matrix.shard }}${{ matrix.tier && format(', {0}', matrix.tier) || '' }})
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The six small corpora take ~2 minutes of work together, as much
        # as one job's setup took for each of them alone, so they share a
        # job: 20 jobs became 10, without lengthening the run (FastR's
        # shards take longer). `group` names the job and the artifact.
        include:
          - { group: small, corpora: gnur-tests gnur-examples gnur-demos r-intro cran-purer capi, shard: "1/1" }
          - { group: fastr, corpora: fastr, shard: "1/4" }
          - { group: fastr, corpora: fastr, shard: "2/4" }
          - { group: fastr, corpora: fastr, shard: "3/4" }
          - { group: fastr, corpora: fastr, shard: "4/4" }
          # The same cases in the bytecode VM without the JIT (the top tier
          # on wasm32), against the same ratchet: `corpus.py run --tier`.
          - { group: small, corpora: gnur-tests gnur-examples gnur-demos r-intro cran-purer capi, shard: "1/1", tier: vm }
          - { group: fastr, corpora: fastr, shard: "1/4", tier: vm }
          - { group: fastr, corpora: fastr, shard: "2/4", tier: vm }
          - { group: fastr, corpora: fastr, shard: "3/4", tier: vm }
          - { group: fastr, corpora: fastr, shard: "4/4", tier: vm }
    container:
      image: ${{ needs.select.outputs.image_base }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - name: Run ${{ matrix.group }} (${{ matrix.shard }}${{ matrix.tier && format(', {0}', matrix.tier) || '' }})
        env:
          CORPORA: ${{ matrix.corpora }}
          SHARD: ${{ matrix.shard }}
          TIER: ${{ matrix.tier }}
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export ROBIGO_RDBFLAT="$PWD/dist/rdbflat"
          tier=()
          if [ -n "$TIER" ]; then tier=(--tier "$TIER"); fi
          # every corpus runs even after one fails; any failure fails the job.
          # --net-fixture: what cases fetch from the internet is served on
          # loopback (corpora.toml's net_fixture; the container is root)
          status=0
          for corpus in $CORPORA; do
            python3 scripts/corpus.py run "$corpus" --shard "$SHARD" "${tier[@]}" --net-fixture \
              --robigo dist/robigo --jobs "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit $status
      - name: Name the results
        if: always()
        run: echo "RESULT_NAME=corpus-${{ matrix.group }}-${{ matrix.shard }}${{ matrix.tier && format('-{0}', matrix.tier) || '' }}" | sed 's#/#of#' >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.RESULT_NAME }}
          path: .robigo/results/
          retention-days: 14

  # Mutated scripts and RDS files must never end the process
  # (scripts/fuzz.py). A fixed seed keeps a pull request from failing on
  # inputs its change has nothing to do with; main explores new ones.
  fuzz:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    # A run takes ~3 min: stop a hang long before GitHub's 6 h cap.
    timeout-minutes: 20
    container:
      image: ${{ needs.select.outputs.image_base }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - name: Parser and unserialize
        env:
          FUZZ_SEED: ${{ github.event_name == 'pull_request' && '0' || github.run_id }}
        run: |
          status=0
          for target in parse rds; do
            python3 scripts/fuzz.py "$target" --seconds 60 --jobs "$(nproc)" --robigo dist/robigo --seed "$FUZZ_SEED" \
              | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit $status
      # scripts/reduce.py and the parse-tree mutator and EMI it shares with
      # fuzz-eval, against a robigo stand-in (GNU R 4.5.0 only, no binary)
      - name: Reducer
        run: python3 scripts/test-reduce.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: .robigo/fuzz

  # CRAN packages with compiled code (tests/cran/packages.tsv), installed
  # from source with robigo's own R_HOME and compared with GNU R 4.5.0's
  # recorded result (scripts/cran-gate.py; docs/verification.md).
  cran:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    # A backstop only: above the steps' own limits with every package hanging.
    # That is 25 min per package plus setup, so raise it as packages.tsv grows.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_base }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      # The gate installs from source, so robigo needs its own R_HOME
      # (bin/R, etc/Makeconf, include/, lib/libR.so). robigo looks for it at
      # <exe>/../home: dist/robigo means $PWD/home.
      - name: robigo's R_HOME
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          scripts/robigo-home.sh "$(R RHOME)" dist/robigo home
      - name: Run the CRAN gate
        run: |
          python3 scripts/test-cran-gate.py
          python3 scripts/test-package-suite.py
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export ROBIGO_RDBFLAT="$PWD/dist/rdbflat"
          ROBIGO=dist/robigo python3 scripts/cran-gate.py run | tee -a "$GITHUB_STEP_SUMMARY"

  # User-level package scripts (tests/packages/smoke), transcript-checked
  # against GNU R's recordings on the package suite's pinned library:
  # minutes, on every pull request, where the block suites are nightly.
  # A marked case that stops matching fails here (scripts/package-suite.py
  # smoke; docs/verification.md).
  smoke:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_packages }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Workers run in a network namespace of their own (unshare -n).
      # No --add-host list: smoke cases use no test server.
      options: --cap-add=SYS_ADMIN --cap-add=NET_ADMIN
    env:
      ROBIGO_PKG_ORACLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      # The pinned library, sources and rv, keyed by the lock and the
      # system libraries: sync() is idempotent, and a 504 on the rv
      # download used to flake every job that installs it. Main saves them
      # at the end of the job (package-cache mode: save).
      - uses: ./.github/actions/package-cache
        with:
          mode: restore
      - uses: ./.github/actions/package-suite
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - name: robigo's R_HOME
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          scripts/robigo-home.sh "$(R RHOME)" dist/robigo home
      - name: Run the smoke tier
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives" ROBIGO_RDBFLAT="$PWD/dist/rdbflat" ROBIGO="$PWD/dist/robigo"
          python3 scripts/package-suite.py smoke --out out/smoke.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: smoke
          path: out
          if-no-files-found: ignore
      - uses: ./.github/actions/package-cache
        with:
          mode: save

  # PRs that change the binary's behaviour: run every block the ratchet
  # already covers (tests/packages/passing/), sharded, and fail on REGRESSED
  # markers only. The library is restored from cache; the job runs in
  # parallel with perf and must not become the critical path.
  # Transitional: main currently has pre-existing package regressions being
  # fixed on another track; until that lands, this gate can flag those same
  # regressions on PRs based on main. It is correct once main is green.
  package-gate:
    needs: [select, build]
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' && needs.select.outputs.runtime == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_packages }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add=SYS_ADMIN --cap-add=NET_ADMIN --add-host=httpbin.org:127.0.0.1
    env:
      ROBIGO_PKG_ORACLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      # The pinned library, sources and rv, keyed by the lock and the
      # system libraries: sync() is idempotent, and a 504 on the rv
      # download used to flake every job that installs it. Main saves them
      # at the end of the job (package-cache mode: save).
      - uses: ./.github/actions/package-cache
        with:
          mode: restore
      - uses: ./.github/actions/package-suite
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - name: robigo's R_HOME
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          scripts/robigo-home.sh "$(R RHOME)" dist/robigo home
      - name: Package regression gate (${{ matrix.shard }}/${{ strategy.job-total }})
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives" ROBIGO_RDBFLAT="$PWD/dist/rdbflat" ROBIGO="$PWD/dist/robigo"
          python3 scripts/test-package-suite.py
          python3 scripts/package-suite.py run --ratchet-only --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
            --out "out/package-gate.shard${{ matrix.shard }}.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: package-gate-${{ matrix.shard }}
          path: out
          if-no-files-found: ignore

  perf:
    needs: [select, build, perf-base]
    if: ${{ !cancelled() && !failure() && needs.select.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_base }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # the base and the candidate, each a filtered run (all of them on main),
    # and on a cache miss GNU R too
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's test merge commit and both its parents: the diff
          # against main's commit (HEAD^1) is what scripts/perf-select.py maps
          # to benchmarks.
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v8
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - run: python3 scripts/perf.py fetch
      - name: Select benchmarks
        id: select
        # Pull requests run only the benchmarks their changed paths can
        # affect (benchmarks/selection.toml); main, dispatches and anything
        # the mapping does not cover run all of them. The gate is unchanged.
        run: |
          python3 scripts/test-callgrind-diff.py
          python3 scripts/test-perf-select.py
          python3 scripts/test-perf-gnur.py
          python3 scripts/test-history.py
          python3 scripts/perf-select.py --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      # The base, HEAD^1, built by perf-base and measured here, on this
      # runner, with the same filter as the candidate below: the comparison
      # never mixes runners and never waits for main's run. It sits at
      # base/robigo, a path as long as dist/robigo's: robigo's counts move
      # with the length of its own path (by up to 0.16%,
      # docs/ledger/g3/2026-11-18-perf-base.md).
      - uses: actions/download-artifact@v8
        if: github.event_name == 'pull_request' && steps.select.outputs.run == 'true'
        with:
          name: robigo-base
          path: base
      # GNU R's records (its answers, and its counts for the ratio) for this
      # CPU signature: main's run saves them (below); a pull request measures
      # GNU R itself when they are missing or do not cover its selection.
      - name: GNU R's records' cache key
        id: gnur
        env:
          IMAGE: ${{ needs.select.outputs.image_base }}
        run: |
          sig=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import perf; print(perf.cpu_signature()[1])')
          pkgs=$(dpkg-query -W -f '${Package}=${Version} ' libc6 valgrind 2> /dev/null || true)
          image=$(printf '%s' "$IMAGE" | sha256sum | cut -c1-16)
          echo "key=perf-gnur-1-$image-$sig-$(printf '%s' "$pkgs" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        if: github.event_name == 'pull_request' && steps.select.outputs.run == 'true'
        with:
          path: gnur.json
          key: ${{ steps.gnur.outputs.key }}-${{ hashFiles('benchmarks/**', 'scripts/perf.py') }}
      - name: Measure the base (HEAD^1)
        if: github.event_name == 'pull_request' && steps.select.outputs.run == 'true'
        env:
          PERF_FILTER: ${{ steps.select.outputs.filter }}
        run: |
          chmod +x base/robigo
          echo "baseline: $(cat base/BASELINE), built from the merge's base and measured on this runner" | tee -a "$GITHUB_STEP_SUMMARY"
          export ROBIGO_NATIVES="$PWD/base/natives"
          export ROBIGO_RDBFLAT=""
          export VALGRIND=valgrind
          filter_flag=()
          if [ -n "$PERF_FILTER" ]; then filter_flag=(--filter "$PERF_FILTER"); fi
          # every selected benchmark gets a GNU R record first: the cache's
          # (main's, failures included), else measured here (and a failure
          # once more), so the base and the candidate are both judged
          python3 scripts/perf-gnur.py fill gnur.json "$PERF_FILTER" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/perf.py run --metric instr --runtime robigo --oracle gnur.json \
            --robigo base/robigo --jobs "$(nproc)" --out base/perf.json --quiet "${filter_flag[@]}"
      - name: Measure robigo (and GNU R on main)
        if: steps.select.outputs.run == 'true'
        env:
          # Empty: every benchmark. Only pull requests get a filter.
          PERF_FILTER: ${{ steps.select.outputs.filter }}
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export ROBIGO_RDBFLAT=""
          export VALGRIND=valgrind
          filter_flag=()
          if [ -n "$PERF_FILTER" ]; then filter_flag=(--filter "$PERF_FILTER"); fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python3 scripts/perf.py run --metric instr --runtime both --robigo dist/robigo \
              --jobs "$(nproc)" --out perf.json --quiet "${filter_flag[@]}"
          else
            oracle_flag=""
            runtime="robigo"
            if [ -f base/perf.json ]; then
              oracle_flag="--oracle base/perf.json"
            else
              runtime="both"
            fi
            python3 scripts/perf.py run --metric instr --runtime "$runtime" $oracle_flag --robigo dist/robigo \
              --jobs "$(nproc)" --out perf.json --quiet "${filter_flag[@]}"
          fi
      - name: "Diagnostic: rdbflat win"
        if: github.ref == 'refs/heads/main'
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export VALGRIND=valgrind
          python3 scripts/perf-paired.py --diagnostic-only --robigo dist/robigo --rdbflat dist/rdbflat | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare with main
        if: github.event_name == 'pull_request' && steps.select.outputs.run == 'true'
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export ROBIGO_RDBFLAT=""
          python3 - <<'PY'
          import json
          # Ensure GNU R's counts and outputs come from baseline if not already attached.
          b = json.load(open("base/perf.json")); n = json.load(open("perf.json"))
          updated = False
          for k, v in n["results"].items():
              if "gnur" not in v and "gnur" in b["results"].get(k, {}):
                  v["gnur"] = b["results"][k]["gnur"]
                  updated = True
          if updated:
              json.dump(n, open("perf.json", "w"), indent=1, sort_keys=True)
          PY
          python3 scripts/perf.py report perf.json --markdown >> "$GITHUB_STEP_SUMMARY"
          # Compare flagged regressions with both exact executables and the
          # cache disabled. Cache wins are diagnostic only. Preserve original
          # measurements and profiles; the 0.5% threshold is unchanged.
          python3 scripts/test-perf-paired.py
          python3 scripts/perf-paired.py base/perf.json perf.json \
            --base-robigo base/robigo --robigo dist/robigo \
            --rdbflat dist/rdbflat | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/perf.py report perf.json --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/perf-gnur.py extract perf.json gnur.json
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.select.outputs.run == 'true'
        with:
          path: gnur.json
          key: ${{ steps.gnur.outputs.key }}-${{ hashFiles('benchmarks/**', 'scripts/perf.py') }}
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request' && steps.select.outputs.run == 'true'
        with:
          name: perf-paired-profiles
          path: .robigo/perf-paired
      - uses: actions/upload-artifact@v7
        if: steps.select.outputs.run == 'true'
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'perf-main' || 'perf' }}
          path: perf.json
          retention-days: 90

  # perf's gate for robigo-rt: the M1 bars (docs/g3.md §15.3: E1, E2, E7 and
  # the peak-RSS bars of E2 and E4), `scripts/perf.py rt-bars` over
  # benchmarks/rt/m1-bars.toml, in two jobs beside `rt` (only `select`
  # before them). `perf-rt-build` builds robigo-rt, and main's binary of the
  # merge's base, on rt's cargo cache. `perf-rt` measures them in the 4.6.2
  # oracle image, so that GNU R's side of every bar is measured on the same
  # runner's CPU: instruction counts move with glibc's CPU dispatch, so no
  # bar may mix CPUs (docs/ledger/g3/2026-11-16-a2-perf-rt-policy.md).
  perf-rt-build:
    needs: select
    if: ${{ needs.select.outputs.rt == 'true' && needs.select.outputs.stacked != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # the merge commit and its parents: the base is HEAD^1
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rt
          # the rt job saves this cache; two jobs saving one key would race
          save-if: false
      # the starts' R_HOME trees (perf-rt's [[startup]]) are build products:
      # made here, with the toolchain and GNU R's sources, each binary's in
      # its own checkout, and shipped beside the binaries (perf-rt runs in
      # the oracle image, which has no cargo)
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - name: Build robigo-rt
        run: |
          cargo build --release --locked -p robigo-rtapi
          mkdir -p dist
          cp target/release/robigo-rt dist/robigo-rt
          python3 scripts/rt-startup.py --robigo-rt dist/robigo-rt --pack-trees dist/rt-trees.tar
      - name: Build main's robigo-rt
        # the merge's base, HEAD^1, on the same cache: only the crates that
        # differ rebuild. Its trees are main's checkout's, packed by this
        # checkout's rt-startup.py (main's may not have it)
        if: github.ref != 'refs/heads/main'
        run: |
          git config --global --add safe.directory '*'
          cp scripts/rt-startup.py scripts/scratch.py "$RUNNER_TEMP/"
          head=$(git rev-parse HEAD)
          git checkout -q --detach HEAD^1
          cargo build --release --locked -p robigo-rtapi
          cp target/release/robigo-rt dist/robigo-rt-main
          python3 "$RUNNER_TEMP/rt-startup.py" --robigo-rt dist/robigo-rt-main --checkout . \
            --pack-trees dist/rt-trees-main.tar
          git checkout -q --detach "$head"
      - uses: actions/upload-artifact@v7
        with:
          name: perf-rt-bins
          path: dist
          retention-days: 1

  # The gate. It fails when a bar marked met breaks, against GNU R measured
  # on this CPU signature and today's-robigo's committed numbers, when an
  # accepted regression passes its ceiling, or when a row is more than
  # perf's threshold slower than with main's binary, measured beside it.
  # GNU R's side (`perf.py rt-gnur`) is cached per (oracle image, CPU
  # signature, the libc6 and valgrind packages, measurement inputs) and
  # measured here on a miss.
  # Estimated cycles under the pinned cache model are reported, never failed
  # on (docs/ledger/g3/2026-11-16-cycles-study.md).
  perf-rt:
    needs: [select, perf-rt-build]
    if: ${{ needs.select.outputs.rt == 'true' && needs.select.outputs.stacked != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_oracle_4_6_2 }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: valgrind
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends valgrind > /dev/null
          valgrind --version
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - uses: actions/download-artifact@v7
        with:
          name: perf-rt-bins
          path: dist
      - name: The runner's CPU
        id: cpu
        env:
          IMAGE: ${{ needs.select.outputs.image_oracle_4_6_2 }}
        run: |
          chmod +x dist/*
          sig=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import perf; print(perf.cpu_signature()[1])')
          model=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import perf; print(perf.cpu_signature()[0])')
          # installing valgrind pulls libc6-dbg, which needs libc6's exact
          # version and so can upgrade the C library: its version is part of
          # the key, as is valgrind's package
          pkgs=$(dpkg-query -W -f '${Package}=${Version} ' libc6 valgrind)
          image=$(printf '%s' "$IMAGE" | sha256sum | cut -c1-16)
          echo "CPU: $model, signature $sig; ${pkgs% }; oracle image $IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          # rt-gnur-2: the rival is GNU R's literal default build (the lead's
          # F2, docs/ledger/g3/2026-11-17-a0b-stock-rival.md), not the image's;
          # rt-gnur-3: churn.R starts with a full collection (m1-bars.toml)
          echo "key=rt-gnur-3-$image-$sig-$(printf '%s' "$pkgs" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: gnur
        with:
          path: rt-gnur.json
          # the measurement's inputs: the rows, the bars and their programs, the
          # scripts, and the rival's build (gnur-stock.sh, the tarball pin in r-src.sh)
          key: ${{ steps.cpu.outputs.key }}-${{ hashFiles('benchmarks/rt/calls-rows.toml', 'benchmarks/rt/m1-bars.toml', 'benchmarks/rt/mem/*.R', 'benchmarks/suite/binarytrees.R', 'scripts/idiom-vs-r.py', 'scripts/rss.py', 'scripts/perf.py', 'scripts/rt-startup.py', 'scripts/gnur-stock.sh', 'scripts/r-src.sh') }}
      # The rival, GNU R's literal default build in this image's toolchain, is
      # needed only to measure GNU R: it does not depend on the CPU, so it is
      # cached per image and build script.
      - uses: actions/cache/restore@v6
        id: stock
        if: steps.gnur.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/robigo-research/gnur-stock
          key: gnur-stock-1-${{ steps.cpu.outputs.image }}-${{ hashFiles('scripts/gnur-stock.sh', 'scripts/r-src.sh') }}
      - name: GNU R 4.6.2's literal default build
        if: steps.gnur.outputs.cache-hit != 'true' && steps.stock.outputs.cache-hit != 'true'
        run: scripts/gnur-stock.sh ~/.cache/robigo-research/gnur-stock
      - uses: actions/cache/save@v6
        if: steps.gnur.outputs.cache-hit != 'true' && steps.stock.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/robigo-research/gnur-stock
          key: ${{ steps.stock.outputs.cache-primary-key }}
      - name: GNU R's side, measured on this CPU signature
        if: steps.gnur.outputs.cache-hit != 'true'
        run: |
          stock=~/.cache/robigo-research/gnur-stock
          r_home=$(env -u R_HOME "$stock/bin/R" RHOME)
          tee -a "$GITHUB_STEP_SUMMARY" < "$stock/robigo-stock.txt"
          RSCRIPT_BIN="$r_home/bin/exec/R" R_HOME_DIR="$r_home" \
            python3 scripts/perf.py rt-gnur --jobs "$(nproc)" --out rt-gnur.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v6
        if: steps.gnur.outputs.cache-hit != 'true'
        with:
          path: rt-gnur.json
          key: ${{ steps.gnur.outputs.cache-primary-key }}
      - name: M1 bars
        run: |
          python3 scripts/test-perf-rt-bars.py
          python3 scripts/test-rt-startup.py
          # (the starts, [[startup]], boot each binary from the trees
          # perf-rt-build packed for it: scripts/rt-startup.py)
          main_flag=()
          if [ -f dist/robigo-rt-main ]; then
            main_flag=(--main dist/robigo-rt-main --main-trees dist/rt-trees-main.tar)
          fi
          python3 scripts/perf.py rt-bars --robigo-rt dist/robigo-rt --trees dist/rt-trees.tar \
            "${main_flag[@]}" --gnur rt-gnur.json \
            --cycles --jobs "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"

  # robigo-rt's corpus column (`corpus.py run --runtime rt`, against the rt
  # pin's recordings and the `passing-rt/` ratchets;
  # docs/ledger/g3/2026-11-17-rc-rt-corpora.md). A pull request runs a
  # quarter of fastr, the quarter rotating with its number, and a push to
  # main runs all of it (about two minutes). The four corpora in echo mode
  # (`-f FILE`'s transcript) run whole every time: they are small. Those
  # with a build step wait for robigo-rt's natives.
  rt-corpora:
    needs: [select, perf-rt-build]
    if: ${{ needs.select.outputs.rt == 'true' && needs.select.outputs.stacked != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.select.outputs.image_rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - uses: actions/download-artifact@v7
        with:
          name: perf-rt-bins
          path: dist
      - name: fastr on robigo-rt
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          chmod +x dist/robigo-rt
          shard=1/1
          if [ -n "$PR" ]; then shard="$(( PR % 4 + 1 ))/4"; fi
          # named as the corpora jobs' results are (corpus-GROUP-SHARD)
          echo "RESULT_NAME=corpus-rt-fastr-${shard/\//of}" >> "$GITHUB_ENV"
          python3 scripts/corpus.py run fastr --runtime rt --shard "$shard" --robigo dist/robigo-rt \
            --jobs "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: the echo-mode corpora on robigo-rt
        run: |
          # every corpus runs; the step fails if any regressed
          failed=0
          for c in gnur-tests gnur-examples gnur-demos r-intro; do
            python3 scripts/corpus.py run "$c" --runtime rt --robigo dist/robigo-rt --jobs "$(nproc)" \
              | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.RESULT_NAME || 'corpus-rt-fastr' }}
          path: .robigo/results/
          retention-days: 14

  # Branch protection requires this job, `Check`, and nothing else, so
  # adding, splitting or resharding jobs needs no ruleset change: add every
  # new gating job to `needs`. It passes when each job passed, or was skipped
  # because `select` said so; a failed, cancelled or unexplained skip fails
  # it. `always()`: a skipped required check counts as passing, so a run
  # cancelled before its evidence exists must still report a failure here.
  # What `Check` certifies: every job it waits for passed, or was skipped as
  # `select` said. A run cancelled before that (superseded, or by hand) has a
  # cancelled or skipped need, which fails it; a run cancelled only after
  # every need passed has produced that evidence, and its `Check` may pass,
  # as before this group existed. A `Check` that ends cancelled itself is not
  # a pass either. A superseded run's `Check` holds the pull request's group
  # until it has had a runner, so the new run waits that long.
  check:
    name: Check
    if: ${{ always() }}
    needs: [select, lint, miri, rdb-data, builtin-diff-data, rt, rt-gctorture, rt-feature-builds, rt-builtin-diff, rt-debug-assertions, rt-release-crate-tests, base-subset, build, perf-base, release-tests, test, bytecode-fidelity, counters, corpora, fuzz, cran, smoke, package-gate, perf, perf-rt-build, perf-rt, rt-corpora]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github/workflows
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' && '--pull-request' || '' }}
        run: |
          python3 scripts/test-ci-check.py 2>&1 | tail -1
          python3 scripts/ci-check.py $PULL_REQUEST

  progress:
    # main only: record this commit's speed and compatibility on the orphan
    # branch progress-data and publish the README's charts and badges on
    # GitHub Pages (scripts/history.py, docs/verification.md). `sync`
    # also records earlier main runs the history lacks.
    needs: [build, test, corpora, perf, smoke]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 15
    concurrency:
      group: progress
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git gh python3 ca-certificates > /dev/null
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Record on progress-data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            rm -rf data && git worktree prune
            git fetch -q --depth 1 origin +refs/heads/progress-data:refs/remotes/origin/progress-data
            git worktree add -q --detach data origin/progress-data
            python3 scripts/history.py add data/history.jsonl artifacts --commit "$GITHUB_SHA" \
              --run "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
            python3 scripts/history.py sync data/history.jsonl --repo "$GITHUB_REPOSITORY" --limit 20 ||
              echo "::warning::history sync failed; recording this commit only"
            git -C data add history.jsonl
            if git -C data diff --cached --quiet; then break; fi
            git -C data commit -q -m "history: ${GITHUB_SHA::12}"
            if git -C data push -q origin HEAD:refs/heads/progress-data; then break; fi
            if [ "$try" = 5 ]; then exit 1; fi
            sleep $((try * 5))   # another run pushed first: redo on top of it
          done
      - name: Check for slow perf creep
        # Not a gate: main stays green. The pull-request gate allows 0.5% per
        # benchmark per pull request; this compares main's instruction counts
        # with the median of the runs before and with the run a week back
        # (scripts/history.py check). A regression the run before did not
        # show opens an issue labelled perf-regression, or comments on the
        # open one.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/perf-creep.md"
          python3 scripts/history.py check data/history.jsonl --commit "$GITHUB_SHA" --report "$report" \
            --repo "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          [ -s "$report" ] || exit 0
          # First, so a failed gh call below cannot lose the alert.
          echo "::warning::main got slower past the noise band: see the run summary and the perf-regression issue"
          gh label create perf-regression -R "$GITHUB_REPOSITORY" --color B60205 --force \
            --description "main got slower than its recent runs or its run a week back"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label perf-regression --state open --json number \
            --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body-file "$report"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label perf-regression --body-file "$report" \
              --title "Perf creep on main at ${GITHUB_SHA::10}"
          fi
      - run: python3 scripts/history.py render data/history.jsonl --out site --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # The history record above is what must succeed; the site deploy may
      # fail on its own: deploy-pages lists the run's artifacts once, and that
      # listing can lag the upload a moment before (2026-11-21, runs
      # 44892798651 and 44913195873: "Found 17 artifact(s)", without
      # `github-pages`). So it gets one retry after 30 s, and a warning, not a
      # red main, if both fail: the next main run deploys the same history.
      # (The retry uploads nothing: deploy-pages takes the one `github-pages`
      # of the run, and fails, never picks, when it sees two.)
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: echo "::warning::the Pages deploy failed twice (the history record is written; the next main run deploys the site)"
