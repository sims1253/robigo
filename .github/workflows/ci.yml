# Every push and pull request: build, unit tests and conformance, the test
# corpora with their ratchets, and the performance gate. See
# docs/verification.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every main commit gets its own group: its run publishes the perf baseline
# that pull requests built on that commit compare with (a shared group would
# cancel queued main runs). Pull requests cancel their superseded runs.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

# bash with pipefail (GitHub runs `bash -eo pipefail` for `shell: bash`):
# the default `sh -e` takes a pipeline's status from its last command, so
# `corpus.py run ... | tee` passed even when the ratchet failed.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  LANGUAGE: en
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  build:
    runs-on: ${{ vars.ROBIGO_RUNNER || 'ubuntu-24.04' }}
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git > /dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --release --workspace
      # GNU R's base-package natives built from the R 4.5.0 sources
      # (docs/core.md §8): robigo's dyn.load serves the base packages with
      # them instead of the Rust ports (ROBIGO_NATIVES)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/robigo-research/rsrc
          key: r-4.5.0-sources
      - name: Base-package natives
        run: |
          scripts/build-natives.sh stats splines tools parallel
          echo "ROBIGO_NATIVES=$PWD/.robigo/natives" >> "$GITHUB_ENV"
      - name: Unit tests, parser oracle, conformance (all tiers)
        run: cargo test --release --workspace
      - name: Core and C API under gctorture (collect on every allocation)
        run: ROBIGO_GCTORTURE=1 cargo test --release -p robigo-core -p robigo-capi
      - name: Parse corpus ratchet
        run: |
          python3 scripts/parse-corpus.py check fastr gnur-tests gnur-examples | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the binary for later jobs
        run: |
          mkdir -p dist/natives
          cp "$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/robigo" dist/
          for d in .robigo/natives/*/; do
            p=$(basename "$d"); [ -f "$d$p.so" ] && mkdir -p "dist/natives/$p" && cp "$d$p.so" "dist/natives/$p/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: robigo
          path: dist
          retention-days: 7

  corpora:
    needs: build
    runs-on: ${{ vars.ROBIGO_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { corpus: gnur-tests, shard: "1/1" }
          - { corpus: gnur-examples, shard: "1/1" }
          - { corpus: gnur-demos, shard: "1/1" }
          - { corpus: r-intro, shard: "1/1" }
          - { corpus: cran-purer, shard: "1/1" }
          - { corpus: capi, shard: "1/1" }
          - { corpus: fastr, shard: "1/4" }
          - { corpus: fastr, shard: "2/4" }
          - { corpus: fastr, shard: "3/4" }
          - { corpus: fastr, shard: "4/4" }
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git > /dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v4
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - name: Run ${{ matrix.corpus }} (${{ matrix.shard }})
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          python3 scripts/corpus.py run ${{ matrix.corpus }} --shard ${{ matrix.shard }} \
            --robigo dist/robigo --jobs "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Name the results
        if: always()
        run: echo "RESULT_NAME=corpus-${{ matrix.corpus }}-${{ matrix.shard }}" | sed 's#/#of#' >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.RESULT_NAME }}
          path: .robigo/results/
          retention-days: 14

  perf:
    needs: build
    runs-on: ${{ vars.ROBIGO_RUNNER || 'ubuntu-24.04' }}
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git > /dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - uses: actions/download-artifact@v4
        with:
          name: robigo
          path: dist
      - run: chmod +x dist/robigo
      - run: python3 scripts/perf.py fetch
      - name: Measure robigo (and GNU R on main)
        run: |
          export ROBIGO_NATIVES="$PWD/dist/natives"
          export VALGRIND=valgrind
          runtime=robigo
          [ "${{ github.ref }}" = refs/heads/main ] && runtime=both
          python3 scripts/perf.py run --metric instr --runtime $runtime --robigo dist/robigo \
            --jobs "$(nproc)" --out perf.json --quiet
      - name: Compare with main
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The PR's merge commit is built on main's commit HEAD^1 (its first
          # parent, read from the commit object, which the shallow checkout
          # has): compare with that commit's numbers, not with whichever main
          # run finished last (main may have moved since, or that commit's
          # run may still be going: perf-baseline.py waits for it).
          base=$(git -c safe.directory='*' cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          python3 scripts/perf-baseline.py "$base" base | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ! -f base/perf.json ]; then exit 0; fi
          python3 - <<'PY'
          import json
          # GNU R's counts come from main's run on the same runner image.
          b = json.load(open("base/perf.json")); n = json.load(open("perf.json"))
          for k, v in n["results"].items():
              if "gnur" in b["results"].get(k, {}):
                  v["gnur"] = b["results"][k]["gnur"]
          json.dump(n, open("perf.json", "w"))
          PY
          python3 scripts/perf.py report perf.json --markdown >> "$GITHUB_STEP_SUMMARY"
          # Programs found slower are measured once more and keep the lower
          # count: a regression is slower in both runs, an outlier is not.
          VALGRIND=valgrind python3 scripts/perf.py recheck base/perf.json perf.json --robigo dist/robigo \
            --jobs "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/perf.py report perf.json --markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'perf-main' || 'perf' }}
          path: perf.json
          retention-days: 90
