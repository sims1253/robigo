# Daily nightly binaries, one per platform, but only when main moved since
# the last one. A rolling `nightly` release always points at the newest
# nightly; dated `nightly-YYYY-MM-DD` tags keep the history.
# See docs/distribution.md.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has not moved since the last nightly
        type: boolean
        default: false
      dry_run:
        description: Build the binaries without publishing a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  LANGUAGE: en
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      sha: ${{ steps.decide.outputs.sha }}
      date: ${{ steps.decide.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A dry run tests the branch it was started on.
          ref: ${{ inputs.dry_run == true && github.ref || 'main' }}
          fetch-depth: 0
          fetch-tags: true
      - id: decide
        run: |
          sha=$(git rev-parse HEAD)
          date=$(date -u +%F)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          last=""
          if git rev-parse --verify -q nightly >/dev/null; then
            last=$(git rev-list -n 1 nightly)
          fi
          force="${{ inputs.force }}"
          if [ "$force" = "true" ] || [ "$sha" != "$last" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "main $sha moved since last nightly $last (or forced); building"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "main $sha already has a nightly; skipping"
          fi

  # H8: CI's rt job runs the conformance slice under gctorture with the
  # moving collector's young policy (the young objects at each collection,
  # everything at every N-th: scripts/rt-ci.py's GC_MOVE_YOUNG). Here every
  # collection moves everything, so a path run once is still caught by some
  # run. The rt job's image: main's CI made it for this tree.
  rt-image:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    # a checkout and a hash of the image inputs: seconds
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.image.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - id: image
        run: scripts/ci-image.sh refs | tee -a "$GITHUB_OUTPUT"

  rt-full-move:
    needs: [check, rt-image]
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.rt-image.outputs.rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rt
          save-if: false
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - name: rt conformance, every collection moving everything (gctorture), M1's loader
        env:
          RT_CI_TIMES_DIR: ${{ runner.temp }}/rt-case-times
        run: python3 scripts/rt-ci.py --full-move
      # each conformance case's wall time (rt-ci.py's TIMES_DIR), for the
      # slow-case rule and the shards' balance; failed runs too
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rt-case-times-full-move
          path: ${{ runner.temp }}/rt-case-times
          if-no-files-found: ignore
          retention-days: 14

  # The cargo-fuzz targets (fuzz/fuzz_targets; scripts/fuzz-ci.py): every
  # seed corpus replayed, then each target fuzzed for 15 minutes from it. A
  # failure's input is the artifact, with the command that repeats it in the
  # step summary. Pull requests only check the crate and run the targets
  # whose inputs they change, 60 s each (ci.yml's miri job).
  fuzz:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    # three targets' builds (~10 min cold) and 3 x 15 min of fuzzing
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: The fuzz toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-11-02 --profile minimal
          cargo +nightly-2026-11-02 install cargo-fuzz --locked --version 0.13.2
      - name: Every target, replayed and fuzzed for 15 minutes
        run: python3 scripts/fuzz-ci.py run --all --seconds 900
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  # Hostile byte code through robigo-rt (scripts/rt-bc-mutate.py, #976):
  # the rt job replays the corpus and 24 random starts of a fixed seed; here
  # a seed of its own each night (--seed auto: from the run's id, printed
  # first) searches further. A failing start is written as a corpus line, the
  # artifact, ready for tests/bc-mutate/corpus.txt.
  rt-bc-mutate:
    needs: [check, rt-image]
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.rt-image.outputs.rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rt
          save-if: false
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - name: robigo-rt and its trees
        run: |
          cargo build --release --locked -p robigo-rtapi --bin robigo-rt
          scripts/rt-home.sh
          scripts/rt-home-db.sh --robigo-rt "$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/robigo-rt"
      - name: The corpus, then 200 random starts of tonight's seed
        run: |
          rt="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/robigo-rt"
          python3 scripts/rt-bc-mutate.py --robigo-rt "$rt" --seed auto --processes 200 --batch 100 \
            --jobs "$(nproc)" --failures-out "$RUNNER_TEMP/bc-mutate-failures.txt"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: bc-mutate-failures
          path: ${{ runner.temp }}/bc-mutate-failures.txt
          if-no-files-found: ignore
          retention-days: 14

  # the boot heap's freeze: CI's E3 checks its invariant at every 16th
  # collection (docs/ledger/g3/2026-11-21-h-boot-freeze-check.md); here at
  # every collection, the cases that need it given longer
  # (scripts/rt-ci.py's FREEZE_CHECK_SLOW)
  rt-freeze-check:
    needs: [check, rt-image]
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.rt-image.outputs.rust }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rt
          save-if: false
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/robigo-research/rsrc/R-4.6.2.tar.gz
          key: r-4.6.2-tarball
      - name: GNU R 4.6.2 sources
        run: scripts/r-src.sh
      - name: rt conformance under gctorture, the freeze checked at every collection, M1's loader
        env:
          RT_CI_TIMES_DIR: ${{ runner.temp }}/rt-case-times
        run: python3 scripts/rt-ci.py --freeze-check
      # each conformance case's wall time, for FREEZE_CHECK_SLOW; failed runs too
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rt-case-times-freeze-check
          path: ${{ runner.temp }}/rt-case-times
          if-no-files-found: ignore
          retention-days: 14

  # Profile-guided optimization needs GNU R 4.5.0's library to train on, and
  # the oracle's container has it. Its newer glibc must not reach the binaries,
  # so only the profile leaves this job. macOS has no such R and stays without
  # (scripts/pgo-build.sh).
  profile:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git > /dev/null
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: ./.github/actions/setup
      - run: rustup component add llvm-tools
      - env:
          ROBIGO_RELEASE: nightly-${{ needs.check.outputs.date }}-${{ needs.check.outputs.sha }}
        run: scripts/pgo-build.sh profile ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: profile-${{ matrix.target }}
          path: .robigo/pgo/robigo.profdata
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [check, profile]
    if: needs.check.outputs.proceed == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zlib1g-dev libbz2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - if: runner.os == 'Linux'
        uses: actions/download-artifact@v8
        with:
          name: profile-${{ matrix.target }}
          path: .robigo/profile
      - name: Build
        env:
          ROBIGO_RELEASE: nightly-${{ needs.check.outputs.date }}-${{ needs.check.outputs.sha }}
        run: |
          if [ -f .robigo/profile/robigo.profdata ]; then
            scripts/pgo-build.sh use .robigo/profile/robigo.profdata ${{ matrix.target }}
          else
            cargo build --release --locked -p robigo-cli --target ${{ matrix.target }}
          fi
      - name: "Smoke test (no GNU R installed: vendored base only)"
        run: |
          bin="target/${{ matrix.target }}/release/robigo"
          "$bin" --version
          out=$(env -u R_HOME "$bin" --vanilla -e 'cat(1+1, "\n")' 2>/dev/null)
          [ "$out" = "2 " ] || { echo "smoke test failed: got '$out'"; exit 1; }
      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/robigo"
          staging="dist/robigo-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "$bin" README.md LICENSE "$staging/"
          tar -czf "dist/robigo-${{ matrix.target }}.tar.gz" -C dist "robigo-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 3

  # Publish what built: a platform that fails must not cost the others a
  # nightly. The notes do not promise a list of platforms.
  release:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.outputs.proceed == 'true' && needs.build.result != 'skipped' && inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum robigo-*.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ needs.check.outputs.sha }}"
          date="${{ needs.check.outputs.date }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Dated tag for the history (a re-run that day keeps the first tag).
          git tag "nightly-$date" "$sha" 2>/dev/null && git push origin "nightly-$date" || true
          # Rolling tag + release with the binaries.
          git tag -f nightly "$sha"
          git push -f origin nightly
          gh release delete nightly --yes || true
          notes="Nightly build of \`main\` @ \`${sha:0:12}\` ($date).
          Built with \`cargo build --release -p robigo-cli\` (\`robigo --version\` reports \`nightly-$date-${sha:0:7}\`).
          Runs on its own with the vendored base library; with GNU R 4.5 installed it also loads the rest of the library (see docs/distribution.md)."
          gh release create nightly --prerelease \
            --title "Nightly ($date)" --notes "$notes" \
            dist/robigo-*.tar.gz dist/SHA256SUMS.txt

  # A nightly nobody reads is no check: when any job above fails, one
  # tracking issue gets the run's link and the failing jobs (opened if none
  # is open, commented on otherwise). It closes nothing. The only job with a
  # write permission besides the release's, and that one only to issues.
  notify:
    needs: [check, rt-image, fuzz, rt-bc-mutate, rt-full-move, rt-freeze-check, profile, build, release]
    if: ${{ always() && contains(needs.*.result, 'failure') && inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - name: The tracking issue gets the failing run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          title="nightly: failing runs (automated)"
          failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")')
          body=$(printf '%s\n' \
            "This comment is automated: .github/workflows/nightly.yml's notify job writes it when a nightly job fails." \
            "" \
            "- run: $RUN_URL" \
            "- main at: ${SHA:-unknown}" \
            "- failing jobs: $failed")
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
