# Labels each pull request by size (size:XS ... size:XXL, changed lines
# outside tests) and comments what its tests gained or lost: conformance
# scripts, ratchet markers per suite (a removed marker is called out), Rust
# and Python tests. scripts/pr-delta.py; dispatch it to redo one PR.
name: pr-delta

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

# bash with pipefail: `test-pr-delta.py | tail` must fail when the tests do.
defaults:
  run:
    shell: bash

concurrency:
  group: pr-delta-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  delta:
    name: Size and test delta
    # A fork's pull request gets a read-only token: nothing to write with.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The scripts run from the workflow's own ref: on a pull request that
      # is its test merge commit (same repository only, see `if`); on a
      # dispatch, the dispatched branch. The pull request named by a
      # dispatch, maybe a fork's, is fetched as data and never run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Label and comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "::error::not a pull request number: $PR"; exit 1;; esac
          # the test merge commit and its first parent, the base: their diff
          # is the pull request's change
          git fetch -q --no-tags --depth=2 origin "+refs/pull/$PR/merge:refs/remotes/pr-delta/merge"
          python3 scripts/test-pr-delta.py 2>&1 | tail -1
          python3 scripts/pr-delta.py pr-delta/merge^1 pr-delta/merge --apply "$PR"
