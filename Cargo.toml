[workspace]
resolver = "2"
members = [
    "crates/robigo-syntax",
    "crates/robigo-numerics",
    "crates/robigo-text",
    "crates/robigo-runtime",
    "crates/robigo-cli",
    "crates/robigo-core",
    "crates/robigo-capi",
    # The conformance runner both runtimes' tests share (dev-dependency only).
    "crates/robigo-conformance",
    # G3 (docs/g3.md §14.1): outside the robigo binary until the flip (M7).
    "crates/robigo-heap",
    "crates/robigo-rtcore",
    "crates/robigo-rtbuiltins",
    "crates/robigo-rt",
    "crates/robigo-rtapi",
]
# experiments: the memory bake-off is its own workspace
# (docs/workstreams.md, track memory). fuzz: the cargo-fuzz harnesses are
# a nightly-only crate built outside the workspace (docs/profiling.md).
exclude = ["experiments", "fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/sims1253/robigo"
authors = ["Maximilian Scholz"]

[workspace.dependencies]
robigo-syntax = { path = "crates/robigo-syntax" }
robigo-numerics = { path = "crates/robigo-numerics" }
robigo-runtime = { path = "crates/robigo-runtime" }

# Most of the code is a port of GNU R's C, and the contract is to stay close
# to it: these lints would move the code away from its source, or change what
# happens with NaN. Everything else clippy finds is an error in CI.
[workspace.lints.rust]
# Every crate states what may be unsafe in its lib.rs; see docs/architecture.md.
unsafe_op_in_unsafe_fn = "deny"

# A dependency no crate uses is an error (Cargo's own lints, Rust 1.100).
[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
approx_constant = "allow"
collapsible_if = "allow"
eq_op = "allow"
excessive_precision = "allow"
if_same_then_else = "allow"
manual_clamp = "allow"
needless_range_loop = "allow"
neg_cmp_op_on_partial_ord = "allow"
too_many_arguments = "allow"
# Rust API shapes this codebase has chosen.
chunks_exact_to_as_chunks = "allow"
large_enum_variant = "allow"
len_without_is_empty = "allow"
mutable_key_type = "allow"
result_large_err = "allow"
result_unit_err = "allow"
should_implement_trait = "allow"
type_complexity = "allow"
wrong_self_convention = "allow"

[profile.release]
# Keep workspace optimization independent of codegen-unit partition changes.
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
panic = "unwind"

# Cranelift with one codegen unit exceeds the 4 GiB build budget.
[profile.release.package.cranelift-codegen]
codegen-units = 16

# Unoptimized code evaluates floating-point operands in another order, which
# changes the NaN payload that survives complex arithmetic: conformance needs
# at least this (tests/r/math/complex-nan-payloads.R).
[profile.dev]
opt-level = 1

# For iterating: a one-file rebuild takes seconds instead of minutes, and the
# binary is about 30% slower than `release`. Never measure performance with
# it. `scripts/build.sh --quick` builds it; CI's test harnesses use it too.
[profile.quick]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true

[profile.quick.package.cranelift-codegen]
codegen-units = 256

[profile.bench]
inherits = "release"
