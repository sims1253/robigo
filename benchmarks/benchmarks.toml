# Benchmark suites for scripts/perf.py.
#
# A suite is either a directory of programs in this repository (each *.R
# runs like `Rscript FILE`) or a pinned commit of an external repository
# whose benchmarks define `execute(param)` (or `execute()`, then run
# `param` times), as in Ř's RBenchmarking. External sources are fetched by
# `scripts/perf.py fetch`, not vendored (RBenchmarking has no license).

[suites.robigo]
dir = "benchmarks/suite"
default_packages = "utils,stats"

[suites.rbench]
repo = "https://github.com/reactorlabs/RBenchmarking"
commit = "a92447b37a03e96f8da1e18eb3cd8ab3b46fbf89"
default_packages = "utils,stats"
