# Run-once code (the compile census, docs/ledger/g3/2026-11-23-compile-census.md):
# each iteration evaluates a call made afresh, which robigo-rt compiles at
# its first evaluation (eval::expr_code) and GNU R evaluates as an AST.
# Report-only: no bar or guard cites them. Their first numbers, robigo-rt's
# and GNU R 4.6.2's, are in that ledger entry.

