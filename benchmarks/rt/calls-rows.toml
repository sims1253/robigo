# --- M2/M3 decision rows (docs/ledger/g3/2026-11-17-m2m3-bars.md) ---------------
#
# Each names the decision whose bar cites it. A row robigo-rt cannot run yet
# (`with`, `parse`, `source`, `cbind`, `rbind` are outside its base subset on
# 2026-11-17) is preliminary for that bar until it runs.

[[row]]
name = "scalars"
group = "layout"
note = "D8: a new heap double per iteration, stored into a 1,000-element list (the scalar header)"
setup = '''
l <- vector("list", 1000L)
'''
body = 'l[[i %% 1000L + 1L]] <- i + 0.5'
n = 4000

[[row]]
name = "plist"
group = "layout"
note = "D13: structure() with two attributes, as.pairlist of two elements, do.call with 20 arguments"
setup = '''
f20 <- function(...) nargs()
a20 <- as.list(1:20)
'''
body = 'x <- structure(i, a = 1, b = 2); p <- as.pairlist(list(a = i, b = 2)); d <- do.call(f20, a20)'
