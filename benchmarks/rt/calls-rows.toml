'''
body = 'l[[i]] <- i'
n = 20000

[[row]]
name = "runonce"
group = "cold"
note = "D11: eval(parse(text = ...)) of a definition and a call, new code each iteration"
setup = ""
body = 'v <- eval(parse(text = "f <- function(a) a + 1; f(2)"))'
