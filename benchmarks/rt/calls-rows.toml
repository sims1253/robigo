# G3's measurement rows (docs/g3.md §13, §15.2-15.3): each row is one idiom,
# measured by `scripts/idiom-vs-r.py --rows benchmarks/rt/calls-rows.toml` as
# instructions (and, with --cycles, estimated cycles) per iteration of
#
#     SETUP
#     g <- function() { for (i in 1:N) { BODY }; NULL }; g()
#
# at N and 2N under callgrind, so startup, base loading and SETUP cancel.
# A row's SETUP is its `setup`, or with `setup_ref` the setup of that name
# in the `[setups]` table at the end, which rows share (scripts/perf.py's
# rows_with_setups resolves it for every reader).
# That makes robigo-rt, which loads a base subset, comparable with today's
# robigo and GNU R, which load all of base. No C floors (benchmarks/idioms.toml
# has those). SETUP must not define `g`, the harness's loop function. These
# rows are the bars' workloads and must not change once a bar cites them: add
# a row rather than edit one.
#
# `group`:
#   calls  one row per call line of benchmarks/suite/calls.R, its definitions
#          as SETUP and the line as BODY (calls.R sums all calls into one
#          line; a row keeps one of them, accumulating into `s` the same way).
#          `class = "plain-call"` marks g3.md §13's plain-call idioms (the
#          ≤ 0.6x GNU R bar), "m1" the other E1 rows (`e$f`, `<<-`, S3: §15.3
#          names them at ≤ 1.0x; env-fn moved to "m1" on 2026-11-16, see
#          docs/ledger/g3/2026-11-16-bars-oracle-baseline.md); tryCatch joins E1 at M3.
#   suite  fib and binarytrees from benchmarks/suite/ as N/2N loops (E2).
#   e7     the string loops of E7 (paste, match, unique).
#   d10    D10's string rows (docs/ledger/g3/2026-11-17-d10-bar.md).
#   d2s    D2s's dynamic-definition microbench: a callee frame gains a name
#          its closure's body does not define (docs/ledger/g3.md, D2s bar).
#   layout, envs, growth, d0
#          the M2/M3 decisions' rows (D8 and D13; D2u; D12; D0's pilot),
#          docs/ledger/g3/2026-11-17-m2m3-bars.md.
#   cold   run-once code: D11's rows (runonce, source5k; the m2m3 ledger
#          above), and the report-only rows a call made afresh and
#          compiled at its first evaluation costs (toplevel-lines, do-call,
#          eval-parse, map), docs/ledger/g3/2026-11-23-compile-census.md.
#   guard  common VM paths no bar's row reaches, held by the perf-rt gate to
#          the 0.5% rule against main only (m1-bars.toml's [[guard]]): `[`
#          and `[<-` of a double vector, and `[` of a matrix, by scalar
#          indices (docs/ledger/g3/2026-11-17-perf-subset-guard.md). Rows
#          of other groups can be guards too: grow-dbl, scalars and d0-*.
#          Also: arithmetic and sum() on long vectors, `...` forwarding,
#          `$<-` on a list, while and repeat loops
#          (docs/ledger/g3/2026-11-18-perf-guard-rows2.md).
#   conditions
#          the trycatch row split into its branches and neighbours, reported
#          only (no bar cites them): what X9 (frames, argument matching), X7
#          (D11) and S3x-d measure against
#          (docs/ledger/g3/2026-11-17-s3x-d-trycatch-gap.md).
#   datetime
#          date-time conversions in a time zone (a TZ session each call:
#          set_tz, one conversion per element, reset_tz), reported only
#          (no bar cites them): strptime's and as.POSIXct's per-element
#          paths (docs/ledger/g3/2026-11-22-datetime-rows.md).
#   jit    V4's JIT-cost bar (docs/ledger/g3/2026-11-17-v4-4-jit-cost.md):
#          one JIT compile of a closure of benchmarks/suite/calls.R that GNU
#          R's JIT compiles running it, as R_cmpfun1 makes it
#          (`compiler:::tryCmpfun(f)`, eval.c:1828), per iteration, its
#          result checked to be byte code (tryCmpfun returns the closure as
#          it is when the compile fails, which would read as cheap), N = 400
#          (at 40, the extra N compiles catch 0 or 1 of robigo-rt's full
#          collections, ±0.65M per compile: X's profile). GNU R's
#          side only until V4 step 3 lands: robigo-rt cannot load the
#          compiler namespace yet, and idiom-vs-r.py refuses a row that
#          fails (below), so measure them with --no-robigo, or keep them
#          out of a run under both (--filter) until then.
#
# No collection in a row's window: idiom-vs-r.py runs each row at N and 2N
# first, without callgrind, and refuses it unless robigo-rt collects 0 times
# in both runs (docs/ledger/g3/2026-11-23-row-collections.md). A collection
# between them would put one whole collection, whose cost follows the boot's
# live heap, into the row's per-iteration figure (guard-vec-arith was +1.20%
# under the rdb boot for that alone). An allocating row sizes its heap with
# `heap = { R_VSIZE = "...", R_NSIZE = "..." }`, applied to both sides' runs
# (GNU R reads the same variables, startup.c:R_SizeFromEnv). A row whose work
# collects by design is marked `collects = true` (the jit rows: a compile
# allocates): the mark waives the refusal (idiom-vs-r.py's collection_error
# passes the row whatever it counts), so such a row's counts are only
# reported: perf.py rt-bars prints them for both binaries and warns when
# they differ. GNU R's counts are reported beside robigo-rt's, not enforced.
#
# No failing row: the same runs refuse a row whose script exits non-zero or
# prints an R error on either side, by name, before anything is measured,
# `collects = true` or not (source5k on robigo-rt today: base's source()
# calls utils::localeToCharset(), and robigo-rt's library has no utils).
#
# `address_sensitive = true` marks a row whose count follows where its strings
# were allocated: GNU R's string hash, and robigo-rt's port of it, hashes a
# cached string by its address (unique.c:cshash). The bars measure such a row
# as the median over heap shifts (idiom-vs-r.py --shifts, perf.py's
# ADDRESS_SHIFTS; docs/ledger/g3/2026-11-17-address-rows.md).

# --- calls.R ---------------------------------------------------------------

[[row]]
name = "plain"
group = "calls"
class = "plain-call"
note = "tag(i * 0.25, \"bc\"): every argument given, by position, one a string"
setup = '''
s <- 0
tag <- function(x, label) { if (label == "bc") x * 2 else x }
'''
body = 's <- s + tag(i * 0.25, "bc")'
n = 4000

[[row]]
name = "defaults"
group = "calls"
class = "plain-call"
note = "scale_by(i * 0.5): two defaults, both promises forced every call (label == \"zz\" forces label, x * scale forces scale)"
setup = '''
s <- 0
scale_by <- function(x, scale = 1, label = "a") { if (label == "zz") x else x * scale }
'''
body = 's <- s + scale_by(i * 0.5)'
n = 4000

[[row]]
name = "named"
group = "calls"
class = "plain-call"
note = "weigh(y = 2, x = i): arguments matched by name, out of order"
setup = '''
s <- 0
weigh <- function(x, y) { z <- x * y; z + 1 }
'''
body = 's <- s + weigh(y = 2, x = i)'
n = 4000

[[row]]
name = "env-fn"
group = "calls"
class = "m1"
note = "e$f(i): a closure fetched from an environment"
setup = '''
s <- 0
e <- new.env()
e$f <- function(x) x + 1
'''
body = 's <- s + e$f(i)'
n = 4000

[[row]]
name = "superassign"
group = "calls"
class = "m1"
note = "a$dep(i %% 7): `<<-` into a closure's state"
setup = '''
acct <- function() {
  bal <- 0
  list(dep = function(x) { bal <<- bal + x; invisible(bal) }, get = function() bal)
}
a <- acct()
'''
body = 'a$dep(i %% 7)'
n = 4000

[[row]]
name = "s3"
group = "calls"
class = "m1"
note = "area(sq): S3 dispatch through UseMethod"
setup = '''
s <- 0
area <- function(s) UseMethod("area")
area.sq <- function(s) s$side^2
area.default <- function(s) 0
sq <- structure(list(side = 2), class = "sq")
'''
body = 's <- s + area(sq)'
n = 4000

[[row]]
name = "trycatch"
group = "calls"
class = "m3"
note = "safe(x): tryCatch; every other call takes the error branch, as half of calls.R's do"
setup = '''
s <- 0
safe <- function(x) tryCatch(if (x > 0) x else stop("neg"), error = function(err) 0)
'''
# calls.R's safe(i - 6000) raises in its first 6,000 of 12,000 iterations.
# A threshold would not survive N/2N (the 2N run's extra iterations would all
# be positive), so alternate instead: the same one-in-two mix at every N.
body = 's <- s + safe(i %% 2L - 0.5)'
n = 1000

# --- the trycatch row's split (S3x-d): reported, no bar ----------------------

[[row]]
name = "trycatch-ok"
group = "conditions"
note = "safe(0.5): trycatch's row with no error, the value branch only"
setup = '''
s <- 0
safe <- function(x) tryCatch(if (x > 0) x else stop("neg"), error = function(err) 0)
'''
body = 's <- s + safe(0.5)'
n = 1000

[[row]]
name = "trycatch-err"
group = "conditions"
note = "safe(-0.5): trycatch's row with every call raising: stop(), the exiting handler, the handler's call"
setup = '''
s <- 0
safe <- function(x) tryCatch(if (x > 0) x else stop("neg"), error = function(err) 0)
'''
body = 's <- s + safe(-0.5)'
n = 1000

[[row]]
name = "trycatch-bare"
group = "conditions"
note = "safe(0.5) with no tryCatch: trycatch-ok's control, the call and its `if`"
setup = '''
s <- 0
safe <- function(x) if (x > 0) x else 0
'''
body = 's <- s + safe(0.5)'
n = 4000

[[row]]
name = "withcalling-ok"
group = "conditions"
note = "withCallingHandlers() with no condition: a calling handler established and dropped"
setup = '''
s <- 0
safe <- function(x) withCallingHandlers(if (x > 0) x else 0, error = function(err) 0)
'''
body = 's <- s + safe(0.5)'
n = 1000

[[row]]
name = "try-err"
group = "conditions"
note = "try(silent = TRUE) of an error: try's handler formats the message and the call into a try-error"
setup = '''
safe <- function(x) try(if (x > 0) x else stop("neg"), silent = TRUE)
'''
body = 'v <- safe(-0.5)'
n = 200

# --- suite programs as N/2N loops (E2) ---------------------------------------

[[row]]
name = "fib"
group = "suite"
note = "benchmarks/suite/fib.R's fib, one fib(18) (8,361 calls) per iteration"
setup = '''
s <- 0
fib <- function(n) if (n < 2) n else fib(n - 1) + fib(n - 2)
'''
body = 's <- s + fib(18)'
n = 20

[[row]]
name = "binarytrees"
group = "suite"
note = "benchmarks/suite/binarytrees.R's make and check, one depth-8 tree (511 nodes) per iteration"
setup = '''
s <- 0
make <- function(d) if (d == 0) list(NULL, NULL) else list(make(d - 1), make(d - 1))
check <- function(t) if (is.null(t[[1]])) 1 else 1 + check(t[[1]]) + check(t[[2]])
'''
body = 's <- s + check(make(8))'
n = 40

