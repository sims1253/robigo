# G3's measurement rows (docs/g3.md §13, §15.2-15.3): each row is one idiom,
# measured by `scripts/idiom-vs-r.py --rows benchmarks/rt/calls-rows.toml` as
# instructions (and, with --cycles, estimated cycles) per iteration of
#
#     SETUP
#     g <- function() { for (i in 1:N) { BODY }; NULL }; g()
#
# at N and 2N under callgrind, so startup, base loading and SETUP cancel.
# That makes robigo-rt, which loads a base subset, comparable with today's
# robigo and GNU R, which load all of base. No C floors (benchmarks/idioms.toml
# has those). SETUP must not define `g`, the harness's loop function. These
# rows are the bars' workloads and must not change once a bar cites them: add
# a row rather than edit one.
#
# `group`:
#   calls  one row per call line of benchmarks/suite/calls.R, its definitions
#          as SETUP and the line as BODY (calls.R sums all calls into one
#          line; a row keeps one of them, accumulating into `s` the same way).
#          `class = "plain-call"` marks g3.md §13's plain-call idioms (the
#          ≤ 0.6x GNU R bar), "m1" the other E1 rows (`e$f`, `<<-`, S3: §15.3
#          names them at ≤ 1.0x; env-fn moved to "m1" on 2026-11-16, see
#          docs/ledger/g3/2026-11-16-bars-oracle-baseline.md); tryCatch joins E1 at M3.
#   suite  fib and binarytrees from benchmarks/suite/ as N/2N loops (E2).
#   e7     the string loops of E7 (paste, match, unique).
#   d10    D10's string rows (docs/ledger/g3/2026-11-17-d10-bar.md).
#   d2s    D2s's dynamic-definition microbench: a callee frame gains a name
#          its closure's body does not define (docs/ledger/g3.md, D2s bar).
#   layout, envs, growth, cold, d0
#          the M2/M3 decisions' rows (D8 and D13; D2u; D12; D11; D0's
#          pilot), docs/ledger/g3/2026-11-17-m2m3-bars.md.
#   conditions
#          the trycatch row split into its branches and neighbours, reported
#          only (no bar cites them): what X9 (frames, argument matching), X7
#          (D11) and S3x-d measure against
#          (docs/ledger/g3/2026-11-17-s3x-d-trycatch-gap.md).
#   jit    V4's JIT-cost bar (docs/ledger/g3/2026-11-17-v4-4-jit-cost.md):
#          one JIT compile of a closure of benchmarks/suite/calls.R that GNU
#          R's JIT compiles running it, as R_cmpfun1 makes it
#          (`compiler:::tryCmpfun(f)`, eval.c:1828), per iteration. GNU R's
#          side only until V4 step 3 lands: robigo-rt cannot load the
#          compiler namespace yet, and idiom-vs-r.py stops at a row that
#          fails, so measure them with --no-robigo, or keep them out of a
#          run under both (--filter) until then.
#
# `address_sensitive = true` marks a row whose count follows where its strings
# were allocated: GNU R's string hash, and robigo-rt's port of it, hashes a
# cached string by its address (unique.c:cshash). The bars measure such a row
# as the median over heap shifts (idiom-vs-r.py --shifts, perf.py's
# ADDRESS_SHIFTS; docs/ledger/g3/2026-11-17-address-rows.md).

# --- calls.R ---------------------------------------------------------------

[[row]]
name = "plain"
group = "calls"
class = "plain-call"
note = "tag(i * 0.25, \"bc\"): every argument given, by position, one a string"
setup = '''
s <- 0
tag <- function(x, label) { if (label == "bc") x * 2 else x }
'''
body = 's <- s + tag(i * 0.25, "bc")'
n = 4000

[[row]]
name = "defaults"
group = "calls"
class = "plain-call"
note = "scale_by(i * 0.5): two defaults, both promises forced every call (label == \"zz\" forces label, x * scale forces scale)"
setup = '''
s <- 0
scale_by <- function(x, scale = 1, label = "a") { if (label == "zz") x else x * scale }
'''
body = 's <- s + scale_by(i * 0.5)'
n = 4000

[[row]]
name = "named"
group = "calls"
class = "plain-call"
note = "weigh(y = 2, x = i): arguments matched by name, out of order"
setup = '''
s <- 0
weigh <- function(x, y) { z <- x * y; z + 1 }
'''
body = 's <- s + weigh(y = 2, x = i)'
n = 4000

[[row]]
name = "env-fn"
group = "calls"
class = "m1"
note = "e$f(i): a closure fetched from an environment"
setup = '''
s <- 0
e <- new.env()
e$f <- function(x) x + 1
'''
body = 's <- s + e$f(i)'
n = 4000

[[row]]
name = "superassign"
group = "calls"
class = "m1"
note = "a$dep(i %% 7): `<<-` into a closure's state"
setup = '''
acct <- function() {
  bal <- 0
  list(dep = function(x) { bal <<- bal + x; invisible(bal) }, get = function() bal)
}
a <- acct()
'''
body = 'a$dep(i %% 7)'
n = 4000

[[row]]
name = "s3"
group = "calls"
class = "m1"
note = "area(sq): S3 dispatch through UseMethod"
setup = '''
s <- 0
area <- function(s) UseMethod("area")
area.sq <- function(s) s$side^2
area.default <- function(s) 0
sq <- structure(list(side = 2), class = "sq")
'''
body = 's <- s + area(sq)'
n = 4000

[[row]]
name = "trycatch"
group = "calls"
class = "m3"
note = "safe(x): tryCatch; every other call takes the error branch, as half of calls.R's do"
setup = '''
s <- 0
safe <- function(x) tryCatch(if (x > 0) x else stop("neg"), error = function(err) 0)
'''
# calls.R's safe(i - 6000) raises in its first 6,000 of 12,000 iterations.
# A threshold would not survive N/2N (the 2N run's extra iterations would all
# be positive), so alternate instead: the same one-in-two mix at every N.
body = 's <- s + safe(i %% 2L - 0.5)'
n = 1000

# --- the trycatch row's split (S3x-d): reported, no bar ----------------------

[[row]]
name = "trycatch-ok"
group = "conditions"
note = "safe(0.5): trycatch's row with no error, the value branch only"
setup = '''
s <- 0
safe <- function(x) tryCatch(if (x > 0) x else stop("neg"), error = function(err) 0)
'''
body = 's <- s + safe(0.5)'
n = 1000

[[row]]
name = "trycatch-err"
group = "conditions"
note = "safe(-0.5): trycatch's row with every call raising: stop(), the exiting handler, the handler's call"
setup = '''
s <- 0
safe <- function(x) tryCatch(if (x > 0) x else stop("neg"), error = function(err) 0)
'''
body = 's <- s + safe(-0.5)'
n = 1000

[[row]]
name = "trycatch-bare"
group = "conditions"
note = "safe(0.5) with no tryCatch: trycatch-ok's control, the call and its `if`"
setup = '''
s <- 0
safe <- function(x) if (x > 0) x else 0
'''
body = 's <- s + safe(0.5)'
n = 4000

[[row]]
name = "withcalling-ok"
group = "conditions"
note = "withCallingHandlers() with no condition: a calling handler established and dropped"
setup = '''
s <- 0
safe <- function(x) withCallingHandlers(if (x > 0) x else 0, error = function(err) 0)
'''
body = 's <- s + safe(0.5)'
n = 1000

[[row]]
name = "try-err"
group = "conditions"
note = "try(silent = TRUE) of an error: try's handler formats the message and the call into a try-error"
setup = '''
safe <- function(x) try(if (x > 0) x else stop("neg"), silent = TRUE)
'''
body = 'v <- safe(-0.5)'
n = 200

# --- suite programs as N/2N loops (E2) ---------------------------------------

[[row]]
name = "fib"
group = "suite"
note = "benchmarks/suite/fib.R's fib, one fib(18) (8,361 calls) per iteration"
setup = '''
s <- 0
fib <- function(n) if (n < 2) n else fib(n - 1) + fib(n - 2)
'''
body = 's <- s + fib(18)'
n = 20

[[row]]
name = "binarytrees"
group = "suite"
note = "benchmarks/suite/binarytrees.R's make and check, one depth-8 tree (511 nodes) per iteration"
setup = '''
s <- 0
make <- function(d) if (d == 0) list(NULL, NULL) else list(make(d - 1), make(d - 1))
check <- function(t) if (is.null(t[[1]])) 1 else 1 + check(t[[1]]) + check(t[[2]])
'''
body = 's <- s + check(make(8))'
n = 40

# --- E7 string loops -----------------------------------------------------------

[[row]]
name = "e7-paste"
group = "e7"
note = "paste of 100 strings with a changing integer: 100 new CHARSXPs per iteration"
setup = '''
keys <- paste0("k", 1:1000)
q <- keys[seq(1L, 1000L, by = 10L)]
'''
body = 'p <- paste(q, i)'
n = 200

[[row]]
name = "e7-match"
group = "e7"
address_sensitive = true
note = "match of 100 strings into a 1,000-string table"
setup = '''
keys <- paste0("k", 1:1000)
q <- keys[seq(1L, 1000L, by = 10L)]
'''
body = 'm <- match(q, keys)'
n = 200

[[row]]
name = "e7-unique"
group = "e7"
note = "unique of 1,000 strings with 100 distinct values"
setup = '''
keys <- paste0("k", 1:1000)
dup <- rep(keys[1:100], 10L)
'''
body = 'u <- unique(dup)'
n = 200

# --- D2s: names outside a frame's shape -----------------------------------------

[[row]]
name = "d2s-assign"
group = "d2s"
note = "assign() defines a local the body never assigns"
setup = '''
s <- 0
f <- function() { assign("v", 1); v }
'''
body = 's <- s + f()'
n = 5000

[[row]]
name = "d2s-eval"
group = "d2s"
note = "eval(quote(v <- 1)) defines a local through eval"
setup = '''
s <- 0
f <- function() { eval(quote(v <- 1)); v }
'''
body = 's <- s + f()'
n = 5000

[[row]]
name = "d2s-callee-assign"
group = "d2s"
note = "a callee assigns into its caller's frame (assign(envir = parent.frame())); `<<-` cannot stand in: it creates only in the global frame"
setup = '''
s <- 0
setv <- function() assign("v", 1, envir = parent.frame())
f <- function() { setv(); v }
'''
body = 's <- s + f()'
n = 5000

[[row]]
name = "d2s-delayed"
group = "d2s"
note = "delayedAssign in a callee defines a promise in the caller's frame"
setup = '''
s <- 0
h <- function(e) delayedAssign("v", 1, assign.env = e)
f <- function() { h(environment()); v }
'''
body = 's <- s + f()'
n = 5000

# --- D10 string rows (docs/ledger/g3/2026-11-17-d10-bar.md) ---------------------

[[row]]
name = "d10-sprintf"
group = "d10"
note = "sprintf of 100 strings with a changing integer: 100 new strings per iteration"
setup = 'q <- 1:100'
body = 'p <- sprintf("s%d_%d", q, i)'
n = 200

[[row]]
name = "d10-paste-match"
group = "d10"
note = "the penalty case: paste results that exist already, then match (a pointer-identity use)"
setup = 'keys <- paste0("k", 1:1000)'
body = 'm <- match(paste0("k", (1:100 + i) %% 1000L + 1L), keys)'
n = 200

[[row]]
name = "d10-ascharacter"
group = "d10"
note = "as.character(1:1e5): 100,000 strings per iteration, the same ones every time"
setup = 'x <- 1:100000'
body = 's <- as.character(x)'
n = 4

[[row]]
name = "d10-assign"
group = "d10"
note = "assign(paste0(...)): a pasted name to a symbol, then a binding"
setup = 'e <- new.env()'
body = 'assign(paste0("v", i %% 100L), i, envir = e)'
n = 1000

# --- M2/M3 decision rows (docs/ledger/g3/2026-11-17-m2m3-bars.md) ---------------
#
# Each names the decision whose bar cites it. A row robigo-rt cannot run yet
# (`with`, `parse`, `source`, `cbind`, `rbind` are outside its base subset on
# 2026-11-17) is preliminary for that bar until it runs.

[[row]]
name = "scalars"
group = "layout"
note = "D8: a new heap double per iteration, stored into a 1,000-element list (the scalar header)"
setup = '''
l <- vector("list", 1000L)
'''
body = 'l[[i %% 1000L + 1L]] <- i + 0.5'
n = 4000

[[row]]
name = "plist"
group = "layout"
note = "D13: structure() with two attributes, as.pairlist of two elements, do.call with 20 arguments"
setup = '''
f20 <- function(...) nargs()
a20 <- as.list(1:20)
'''
body = 'x <- structure(i, a = 1, b = 2); p <- as.pairlist(list(a = i, b = 2)); d <- do.call(f20, a20)'
n = 1000

[[row]]
name = "henv"
group = "layout"
note = "D13: assign into a hashed environment, 1,000 names in turn"
setup = '''
e <- new.env(hash = TRUE)
k <- paste0("v", 1:1000)
'''
body = 'assign(k[i %% 1000L + 1L], i, envir = e)'
n = 4000

[[row]]
name = "evallist"
group = "envs"
note = "D2u: eval in a list, which makes an unhashed environment per call"
setup = ""
body = 'v <- eval(quote(a + b), list(a = i, b = 2))'
n = 2000

[[row]]
name = "with"
group = "envs"
note = "D2u: with() on a two-element list"
setup = '''
d <- list(a = 1, b = 2)
'''
body = 'v <- with(d, a + b + i)'
n = 2000

[[row]]
name = "l2e"
group = "envs"
note = "D2u: list2env of two elements (unhashed below 100), then assign, get and exists"
setup = ""
body = 'e <- list2env(list(a = i, b = 2)); assign("c", 3, envir = e); v <- get("a", envir = e) + exists("c", envir = e)'
n = 2000

[[row]]
name = "nenv"
group = "envs"
note = "D2u: new.env(hash = FALSE) given 10 names"
setup = '''
nm <- letters[1:10]
'''
body = 'e <- new.env(hash = FALSE); for (k in nm) assign(k, i, envir = e)'
n = 1000

[[row]]
name = "grow-dbl"
group = "growth"
note = "D12: x[i] <- i on a double vector that starts empty (growth amortized over N against 2N)"
setup = '''
x <- numeric(0)
'''
body = 'x[i] <- i'
n = 20000

[[row]]
name = "grow-list"
group = "growth"
note = "D12: l[[i]] <- i on a list that starts empty"
setup = '''
