# --- date-time conversions in a time zone: reported, no bar --------------

[[row]]
name = "datetime-zone-strptime"
group = "datetime"
note = "strptime of 1e5 strings in Europe/Berlin: R_strptime, mktime and the zone name per element"
setup = '''
x <- rep("2024-07-01 12:34:56", 1e5)
'''
body = 'invisible(.Internal(strptime(x, "%Y-%m-%d %H:%M:%S", "Europe/Berlin")))'
n = 2

[[row]]
name = "datetime-zone-asposixct"
group = "datetime"
note = "as.POSIXct of a 1e5-element POSIXlt in Europe/Berlin: one mktime per element"
setup = '''
lt <- .Internal(as.POSIXlt(seq(0, by = 3600, length.out = 1e5), "Europe/Berlin"))
'''
body = 'invisible(.Internal(as.POSIXct(lt, "Europe/Berlin")))'
n = 2

# The setups rows share (`setup_ref`): calls.R's definitions.
[setups]
calls = '''
scale_by <- function(x, scale = 1, label = "a") { if (label == "zz") x else x * scale }
weigh <- function(x, y) { z <- x * y; z + 1 }
tag <- function(x, label) { if (label == "bc") x * 2 else x }
e <- new.env()
e$f <- function(x) x + 1
acct <- function() {
  bal <- 0
  list(dep = function(x) { bal <<- bal + x; invisible(bal) }, get = function() bal)
}
a <- acct()
area <- function(s) UseMethod("area")
area.sq <- function(s) s$side^2
area.default <- function(s) 0
sq <- structure(list(side = 2), class = "sq")
safe <- function(x) tryCatch(if (x > 0) x else stop("neg"), error = function(err) 0)
'''

[[row]]
name = "lapply"
group = "calls"
note = "lapply(x, f): base's lapply over ten elements, a small closure each; report-only (no bar or guard cites it). Each lapply call built its FUN(X[[i]], ...) afresh and compiled it at its first evaluation (eval::expr_code): about 5.5k of the row's instructions (X, 2026-11-23); base's lapply now keeps one such call per isolate (B, docs/ledger/g3/2026-11-23-apply-fcall.md)"
setup = '''
x <- 1:10
f <- function(v) v + 1
'''
body = 'r <- lapply(x, f)'
n = 2000

