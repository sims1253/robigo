# The M1 decision bars as a CI gate: `scripts/perf.py rt-bars` (the perf-rt
# job of .github/workflows/ci.yml; docs/ledger/g3/2026-11-16-m1-bars-gate.md).
# Today's robigo is never run: its numbers are here, measured once. GNU R's
# numbers are here too, but CI measures GNU R on the gating runner's CPU
# instead (`perf.py rt-gnur`, cached per CPU signature; rt-bars --gnur), so
# that no bar mixes CPUs.
#
# - [gnur]: GNU R's side. Since the lead's F2 (2026-11-17,
#   docs/ledger/g3/2026-11-17-a0b-stock-rival.md) the rival is GNU R's
#   literal default build of the rt pin (scripts/oracle-versions): static
#   libR, unhardened, from the pinned tarball, in the oracle image's toolchain
#   (scripts/gnur-stock.sh). It replaced the oracle image's own Debian-flag,
#   shared-libR build (docs/ledger/g3/2026-11-16-bars-oracle-baseline.md).
#   These numbers were measured with `perf.py rt-gnur` on one developer
#   machine, and a local rt-bars run without --gnur uses them. `version` must
#   equal the rt pin: a new pin needs these numbers re-measured, and the gate
#   refuses to run until they are.
# - [today]: today's robigo with the JIT off (G1, docs/ledger/g3.md, "M1
#   baselines"): E2's and E7's bars. Fixed: they compare with a past build.
# - [[bar]]: a row of benchmarks/rt/calls-rows.toml held to `max` times its
#   reference, in callgrind instructions per iteration (docs/g3.md §15.3). A
#   met bar (the default) fails the gate when it breaks. `met = false` marks a
#   bar not met yet: the gate then only blocks regressions against main, and
#   says so when the bar is met, so that it can be set to met.
#   A regression the lead accepted is an unmet bar with `accepted`, the
#   ledger record of the acceptance, and `ceiling`, the ratio to the same
#   reference that the acceptance holds to: above it, the gate fails. The
#   gate refuses to run on a file that breaks one of these rules:
#   - the two keys go together;
#   - only with `met = false`, since an accepted regression is unmet by
#     definition;
#   - `accepted` names a file that exists;
#   - `ceiling` is strictly above `max`, so the acceptance has room.
# - [[rss]]: a program's peak RSS (scripts/rss.py's median) held to at most
#   each named reference.
# Every row and program here is also compared with main's binary of the
# merge's base, measured on the same runner: more than the threshold slower
# fails the gate.

[gnur]
version = "4.6.2"
source = "docs/ledger/g3/2026-11-17-a0b-stock-rival.md"

[gnur.instr]
"plain" = 4275.2
"defaults" = 5448.9
"named" = 4165.0
"env-fn" = 3388.8
"superassign" = 6892.5
"s3" = 17408.4
"fib" = 21255286.6
"binarytrees" = 3373953.6
"e7-paste" = 177076.3
"e7-match" = 203414.4
"e7-unique" = 157942.3

[gnur.rss]
"benchmarks/suite/binarytrees.R" = 42428
"benchmarks/rt/mem/listgrow.R" = 54220
# churn.R starts with a full collection since the foreman's churn decision
# (2026-11-17, its [[rss]] note): re-measured with scripts/rss.py --runs 5 in
# the oracle image (134,684 before, at one of the phase's levels)
"benchmarks/rt/mem/churn.R" = 119628

[today]
source = "docs/ledger/g3.md, M1 baselines"

[today.instr]
"fib" = 8428736
"binarytrees" = 4138805
"e7-paste" = 49821
"e7-match" = 114413
"e7-unique" = 181394

[today.rss]
"benchmarks/suite/binarytrees.R" = 32156

[[bar]]
# E1: a plain-call idiom
row = "plain"
against = "gnur"
max = 0.6

[[bar]]
# E1: a plain-call idiom
row = "defaults"
against = "gnur"
max = 0.6

[[bar]]
# E1: a plain-call idiom
row = "named"
against = "gnur"
max = 0.6

[[bar]]
# E1: `e$f`
row = "env-fn"
against = "gnur"
max = 1.0

[[bar]]
# E1: `<<-`
row = "superassign"
against = "gnur"
max = 1.0

[[bar]]
# E1: S3. Met by S1's argument aliases against the oracle image's build
# (0.976x, docs/ledger/g3/2026-11-16-s1-alias.md); unmet against the stock
# rival (about 1.095x, F2 revised, docs/ledger/g3/2026-11-17-a0b-stock-rival.md)
# and owed by P3, M3's bar-closing package. Until then the gate holds it to
# the 0.5% rule against main, as fib.
row = "s3"
against = "gnur"
max = 1.0
met = false

[[bar]]
# E2, unmet in M1 and owed to the native tier for hot pure closures (G8):
# the lead's decision, docs/ledger/g3/2026-11-16-e2-fib-decision.md
row = "fib"
against = "today"
max = 1.0
met = false

[[bar]]
# E2
row = "binarytrees"
against = "today"
max = 1.0

[[bar]]
# E7: the regression the lead accepted, while it stays at or below 2.0x
# today's robigo, its bar's reference (`ceiling` is a ratio to it, not to
# `max`)
row = "e7-paste"
against = "today"
max = 1.0
met = false
accepted = "docs/ledger/g3/2026-11-15-e7-seq.md"
ceiling = 2.0

[[bar]]
# E7. Address-sensitive (calls-rows.toml): measured as the median over
# perf.py's ADDRESS_SHIFTS, docs/ledger/g3/2026-11-17-address-rows.md
row = "e7-match"
against = "today"
max = 1.0

[[bar]]
# E7. Not address-sensitive since #757 (0.012% over the shifts,
# docs/ledger/g3/2026-11-17-address-rows.md)
row = "e7-unique"
against = "today"
max = 1.0

[[rss]]
# E2 and E4
program = "benchmarks/suite/binarytrees.R"
against = ["today", "gnur"]

[[rss]]
# E4
program = "benchmarks/rt/mem/listgrow.R"
against = ["gnur"]

[[rss]]
# E4. Measured from a full collection: churn.R starts with `invisible(gc())`
# (the foreman's decision, 2026-11-17). Without it the loop starts wherever
# start-up left the collector's cycle, and the peak follows: k MiB of garbage
# made first (k = 0..14) moved it, net of the garbage, between discrete levels,
# 65-80 MB in robigo-rt (5.7% over a 0-4 MiB shift) and 85-132 MB in GNU R,
# so builds with the same allocations, collections and live bytes (L's AC1)
# differed by 5.6%. A median over k in {0, 2, 4, 8} MiB of garbage still moved
# 2.6% (robigo-rt) and 31% (GNU R); after the gc() the peak is smooth in k
# (72.6-74.9 MB, 116.5-119.3 MB: the garbage's own residue), so one
# measurement per binary holds. listgrow and binarytrees do not flip (their
# peak grows with k by about the garbage itself). The data:
# ~/.cache/robigo-research/churn-rss/ (README.md).
program = "benchmarks/rt/mem/churn.R"
against = ["gnur"]
