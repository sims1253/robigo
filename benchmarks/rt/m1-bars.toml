# The M1 decision bars as a CI gate: `scripts/perf.py rt-bars` (the perf-rt
# job of .github/workflows/ci.yml; docs/ledger/g3/2026-11-16-m1-bars-gate.md).
# Today's robigo is never run: its numbers are here, measured once. GNU R's
# numbers are here too, but CI measures GNU R on the gating runner's CPU
# instead (`perf.py rt-gnur`, cached per CPU signature; rt-bars --gnur), so
# that no bar mixes CPUs.
#
# - [gnur]: GNU R's side, measured in the oracle image of the rt pin
#   (scripts/oracle-versions) with the bars tool, on one developer machine,
#   as docs/ledger/g3/2026-11-16-bars-oracle-baseline.md records. A local
#   rt-bars run without --gnur uses them. `version` must equal the rt pin: a
#   new pin needs these numbers re-measured, and the gate refuses to run
#   until they are.
# - [today]: today's robigo with the JIT off (G1, docs/ledger/g3.md, "M1
#   baselines"): E2's and E7's bars. Fixed: they compare with a past build.
# - [[bar]]: a row of benchmarks/rt/calls-rows.toml held to `max` times its
#   reference, in callgrind instructions per iteration (docs/g3.md §15.3). A
#   met bar (the default) fails the gate when it breaks. `met = false` marks a
#   bar not met yet: the gate then only blocks regressions against main, and
#   says so when the bar is met, so that it can be set to met.
#   A regression the lead accepted is an unmet bar with `accepted`, the
#   ledger record of the acceptance, and `ceiling`, the ratio to the same
#   reference that the acceptance holds to: above it, the gate fails. The
#   gate refuses to run on a file that breaks one of these rules:
#   - the two keys go together;
#   - only with `met = false`, since an accepted regression is unmet by
#     definition;
#   - `accepted` names a file that exists;
#   - `ceiling` is strictly above `max`, so the acceptance has room.
# - [[rss]]: a program's peak RSS (scripts/rss.py's median) held to at most
#   each named reference.
# Every row and program here is also compared with main's binary of the
# merge's base, measured on the same runner: more than the threshold slower
# fails the gate.

[gnur]
version = "4.6.2"
source = "docs/ledger/g3/2026-11-16-bars-oracle-baseline.md"

[gnur.instr]
"plain" = 4799.6
"defaults" = 6088.2
"named" = 4639.3
"env-fn" = 3832.0
"superassign" = 7838.1
"s3" = 19213.2
"fib" = 24056137.6
"binarytrees" = 3781021.1
"e7-paste" = 195871.2
"e7-match" = 207794.5
"e7-unique" = 170862.1

[gnur.rss]
"benchmarks/suite/binarytrees.R" = 42060
"benchmarks/rt/mem/listgrow.R" = 54160
"benchmarks/rt/mem/churn.R" = 134392

[today]
source = "docs/ledger/g3.md, M1 baselines"

[today.instr]
"fib" = 8428736
"binarytrees" = 4138805
"e7-paste" = 49821
"e7-match" = 114413
"e7-unique" = 181394

[today.rss]
"benchmarks/suite/binarytrees.R" = 32156

[[bar]]
# E1: a plain-call idiom
row = "plain"
against = "gnur"
max = 0.6

[[bar]]
# E1: a plain-call idiom
row = "defaults"
against = "gnur"
max = 0.6

[[bar]]
# E1: a plain-call idiom
row = "named"
against = "gnur"
max = 0.6

[[bar]]
# E1: `e$f`
row = "env-fn"
against = "gnur"
max = 1.0

[[bar]]
# E1: `<<-`
row = "superassign"
against = "gnur"
max = 1.0

[[bar]]
# E1: S3, met by S1's argument aliases (0.976x GNU R 4.6.2,
# docs/ledger/g3/2026-11-16-s1-alias.md)
row = "s3"
against = "gnur"
max = 1.0

[[bar]]
# E2, unmet in M1 and owed to the native tier for hot pure closures (G8):
# the lead's decision, docs/ledger/g3/2026-11-16-e2-fib-decision.md
row = "fib"
against = "today"
max = 1.0
met = false

[[bar]]
# E2
row = "binarytrees"
against = "today"
max = 1.0

[[bar]]
# E7: the regression the lead accepted, while it stays at or below 2.0x
# today's robigo, its bar's reference (`ceiling` is a ratio to it, not to
# `max`)
row = "e7-paste"
against = "today"
max = 1.0
met = false
accepted = "docs/ledger/g3/2026-11-15-e7-seq.md"
ceiling = 2.0

[[bar]]
# E7. Address-sensitive (calls-rows.toml): measured as the median over
# perf.py's ADDRESS_SHIFTS, docs/ledger/g3/2026-11-17-address-rows.md
row = "e7-match"
against = "today"
max = 1.0

[[bar]]
# E7. Not address-sensitive since #757 (0.012% over the shifts,
# docs/ledger/g3/2026-11-17-address-rows.md)
row = "e7-unique"
against = "today"
max = 1.0

[[rss]]
# E2 and E4
program = "benchmarks/suite/binarytrees.R"
against = ["today", "gnur"]

[[rss]]
# E4
program = "benchmarks/rt/mem/listgrow.R"
against = ["gnur"]

[[rss]]
# E4
program = "benchmarks/rt/mem/churn.R"
against = ["gnur"]
