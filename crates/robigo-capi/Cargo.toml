[package]
name = "robigo-capi"
description = "libR.so: GNU R 4.5's C API over robigo-core (G2, docs/core.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
# Not on crates.io yet: depends on robigo-runtime, which is not
# publishable yet (see its manifest). Follows automatically once it is.
publish = false

[lib]
# The cdylib is libR.so (DT_SONAME libR.so, build.rs); the rlib serves tests.
name = "R"
crate-type = ["cdylib", "rlib"]

[dependencies]
robigo-core = { path = "../robigo-core" }
robigo-numerics.workspace = true
robigo-runtime.workspace = true
libc = "0.2"

[dev-dependencies]
# tests/no_inner_jumps.rs reads the sources
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "visit", "printing"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }

[build-dependencies]
cc = "1"

[features]
bytecode-fidelity = ["robigo-runtime/bytecode-fidelity"]

[lints]
workspace = true
