[package]
name = "robigo-cli"
description = "Command-line interface for robigo."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
# Not on crates.io yet: depends on robigo-runtime, which is not
# publishable yet (see its manifest). Install the binary from a nightly
# release or with `cargo install --git ...` (docs/distribution.md).
publish = false

[[bin]]
name = "robigo"
path = "src/main.rs"

[dependencies]
robigo-syntax.workspace = true
robigo-runtime.workspace = true
# GNU R's C API (libR); the executable exports it to packages' objects
robigo-capi = { path = "../robigo-capi" }
libmimalloc-sys = { version = "0.1.49", default-features = false }
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

[features]
profile = ["dep:pprof"]
op-stats = ["robigo-runtime/op-stats"]
