[package]
name = "robigo-cli"
description = "Command-line interface for robigo."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "robigo"
path = "src/main.rs"

[dependencies]
robigo-syntax.workspace = true
robigo-runtime.workspace = true
# GNU R's C API (libR); the executable exports it to packages' objects
robigo-capi = { path = "../robigo-capi" }
libmimalloc-sys = { version = "0.1.49", default-features = false }
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

[features]
profile = ["dep:pprof"]
op-stats = ["robigo-runtime/op-stats"]

# Preserve GNU R BCODESXP serialization metadata; intentionally opt-in.
bytecode-fidelity = ["robigo-runtime/bytecode-fidelity", "robigo-capi/bytecode-fidelity"]
