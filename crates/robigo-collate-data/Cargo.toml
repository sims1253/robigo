[package]
name = "robigo-collate-data"
description = "ICU 76.1's root collation and Unicode 16.0's canonical decompositions as ICU4X baked data, for robigo-text's collator (generated by scripts/collate-data.sh)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The baked data uses these crates' unstable constructors: keep them at the
# minor version scripts/collate-data.sh's datagen is (2.3).
[dependencies]
icu_collator.workspace = true
icu_collections = { version = "~2.3.0", default-features = false }
icu_normalizer.workspace = true
icu_provider = { version = "~2.3.1", default-features = false, features = ["baked", "sync"] }
zerovec = { version = "0.11", default-features = false }

[lints]
workspace = true
