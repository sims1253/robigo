[package]
name = "robigo-heap"
description = "G3 memory manager: the fork of robigo-core's header'd SEXP heap that the rt crates build on (docs/g3.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Unpublished until G3 replaces the runtime (docs/g3.md §14).
publish = false
keywords = ["r", "garbage-collection", "runtime"]
categories = ["memory-management", "science"]

[dependencies]
libc = "0.2"
robigo-heap-derive = { path = "../robigo-heap-derive" }

[build-dependencies]
cc = "1"

[lints]
workspace = true
