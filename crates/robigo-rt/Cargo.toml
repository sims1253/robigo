[package]
name = "robigo-rt"
description = "G3's runtime: evaluator, contexts and the base loader (docs/g3.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
robigo-heap = { path = "../robigo-heap" }
robigo-numerics = { workspace = true }
robigo-rtcore = { path = "../robigo-rtcore" }
robigo-rtbuiltins = { path = "../robigo-rtbuiltins" }
robigo-syntax = { workspace = true }
robigo-text = { path = "../robigo-text" }
# connections.c's gzip and the lazy-load databases' zlib (L1), on zlib-rs;
# its `std` feature turns on the run-time CPU detection of its checksums
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zlib-rs = { version = "0.6", default-features = false, features = ["std", "rust-allocator"] }

[build-dependencies]
# libdeflate's decompressor (vendor/libdeflate), build.rs
cc = "1"

[features]
# ROBIGO_POISON_DEAD=1 (robigo-rtcore's feature, C1-PZ), and with it
# ROBIGO_POISON_PLANT=1: the compiler clears each closure's value register
# just before its Ret, the early clear the poison must catch (tests/poison.rs)
poison-dead = ["robigo-rtcore/poison-dead"]

[lints]
workspace = true
