[package]
name = "robigo-rtapi"
description = "G3's C API exports over robigo-rt, with no host table, and the robigo-rt binary (docs/g3.md §14.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
libc = "0.2"
robigo-heap = { path = "../robigo-heap" }
robigo-rt = { path = "../robigo-rt" }
robigo-rtbuiltins = { path = "../robigo-rtbuiltins" }
robigo-rtcore = { path = "../robigo-rtcore" }

[build-dependencies]
cc = "1"

[dev-dependencies]
# Not an rt crate: robigo-cli's tests use it too, so a change to it runs
# everything (scripts/ci-selection.toml).
robigo-conformance = { path = "../robigo-conformance" }

# The runtime's binary lives here, above the C API, so that packages it
# dlopens find the exports (docs/g3.md §14.1: heap -> rtcore -> rtbuiltins
# -> rt -> rtapi).
[[bin]]
name = "robigo-rt"
path = "src/main.rs"

[lints]
workspace = true
