[package]
name = "robigo-rtbuiltins"
description = "G3's builtins in safe Rust over the robigo-rtcore facade (docs/g3.md §2.4, §10)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
robigo-numerics = { path = "../robigo-numerics" }
robigo-rtcore = { path = "../robigo-rtcore" }
robigo-text = { path = "../robigo-text" }
pcre2 = "0.2.11"

[features]
# A4's planted divergences (scripts/builtin-diff.py plant): one deliberate
# difference from GNU R per compared field, for the check that the
# differential catches each. Never in a release or measured build.
diff-plant = []

[lints]
workspace = true
