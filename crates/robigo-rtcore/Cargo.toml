[package]
name = "robigo-rtcore"
description = "G3's object API facade over robigo-heap: Cx, branded handles, roots, the value stack (docs/g3.md §2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
robigo-heap = { path = "../robigo-heap" }
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
trybuild = "1"
robigo-heap = { path = "../robigo-heap", features = ["test-support"] }

[features]
# ROBIGO_RETRY_TORTURE=1 (Cx::retry_torture, docs/g3.md §16): compiled in only
# with this feature, as GNU R's --enable-strict-barrier is, since its check in
# every build costs about 0.2-0.7% of the perf rows' instructions
retry-torture = []
# ROBIGO_POISON_DEAD=1 (docs/g3.md §16, C1-PZ): compiled in only with this
# feature. A dead slot (a VM register's last use, a scope's restore) then
# holds a poison that names where it died, and a read of it panics.
poison-dead = []

[lints]
workspace = true
