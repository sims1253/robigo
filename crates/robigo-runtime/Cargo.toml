[package]
name = "robigo-runtime"
description = "Values, environments and evaluator for the robigo R runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
# Not on crates.io yet: build.rs embeds the vendored R sources from
# ../../rlib, which live outside this package and would not ship in the
# .crate. Publishable once the sources move into this crate (or are
# fetched at build time); until then use a git dependency or a nightly
# binary (docs/distribution.md).
publish = false

[dependencies]
robigo-syntax.workspace = true
robigo-numerics.workspace = true
smallvec = "1"
# Native code for hot loops (src/jit.rs).
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# The rdbflat cache maps its files read-only (rdbflat.rs); already linked
# by mimalloc-sys and liblzma, so this adds no library to the binary.
libc = "0.2"
# Raw LZMA2 streams for lazy-load databases (R: connections.c R_decompress3),
# the same C library GNU R links against.
liblzma = "0.4"
# Regular expressions for grep/sub/regexpr/strsplit (see builtins/grep.rs):
# regex-automata for POSIX ERE (leftmost-longest via a DFA), fancy-regex for
# perl = TRUE (look-around, back-references) and EREs with back-references.
regex-automata = "0.4"
fancy-regex = "0.16"

[features]
# Count executed VM ops by kind; printed to stderr when the interpreter
# thread exits (a profiling aid; costs a hash lookup per op).
op-stats = []

bytecode-fidelity = []

[lints]
workspace = true
