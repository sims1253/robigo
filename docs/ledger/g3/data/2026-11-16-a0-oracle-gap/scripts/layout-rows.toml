[[row]]
name = "e7-unique-pad0"
group = "layout"
note = "e7-unique after 0 unrelated strings"
setup = '''
keys <- paste0("k", 1:1000)
dup <- rep(keys[1:100], 10L)
'''
body = 'u <- unique(dup)'
n = 200

[[row]]
name = "e7-match-pad0"
group = "layout"
note = "e7-match after 0 unrelated strings"
setup = '''
keys <- paste0("k", 1:1000)
q <- keys[seq(1L, 1000L, by = 10L)]
'''
body = 'm <- match(q, keys)'
n = 200

