  "{ writeLines('one', 'f1'); writeLines('two', 'f2'); .Internal(file.append('f1', 'f2')) }",
  "{ writeLines('two', 'f2'); .Internal(file.append('new', 'f2')) }",
  "{ writeLines('one', 'f1'); writeLines('two', 'f2'); .Internal(file.append(c('f1', 'f1'), c('f2', 'f2'))) }",
  "{ writeLines('one', 'f1'); writeLines(c('a', 'b'), 'f2'); writeLines('c', 'f3'); .Internal(file.append('f1', c('f2', 'f3'))) }",
  "{ writeLines('one', 'f1'); .Internal(file.append('f1', 'f1')) }",
  "{ writeLines('one', 'f1'); .Internal(file.append('f1', 'nope')) }",
  "{ writeLines('one', 'f1'); writeBin(as.raw(0:255), 'f2'); file.append('f1', 'f2') }",
]

["Sys.chmod"]
