# ---- External: the world outside (each case in a process and directory of its own)

["Sys.getenv"]
args = ["x", "unset"]
typical = { x = "=\"HOME\"", unset = "=\"\"" }
# (no zero-length x: the whole environment, whose R_* and harness variables
# differ between the runtimes and between GNU R's two runs)
domain = { x = ["=\"HOME\"", "=c(\"HOME\", \"TMPDIR\", \"A4_NOT_SET\")", "=\"LC_ALL\"", "\"\"", "a", "chrNA", "chr3", "utf8", "latin1", "bytes", "\" 3 \"", "long", "chrmatrix"], unset = ["=\"\"", "=NA_character_", "@chr"] }

["Sys.setenv"]
args = ["nm", "values"]
effect = "External"
typical = { nm = "=\"A4_X\"", values = "=\"1\"" }
domain = { nm = ["=\"A4_X\"", "=c(\"A4_X\", \"A4_Y\")", "@chr"], values = ["=\"1\"", "=c(\"1\", \"2\")", "@chr"] }
# (the record does not hold the process environment: these read it back)
extra = [
  "{ .Internal(Sys.setenv('A4_X', '1')); Sys.getenv('A4_X', unset = NA) }",
  "{ .Internal(Sys.setenv(c('A4_X', 'A4_Y'), c('1', '2'))); Sys.getenv(c('A4_X', 'A4_Y'), unset = NA) }",
  "{ .Internal(Sys.setenv('A4_X', '')); Sys.getenv('A4_X', unset = NA) }",
  "{ .Internal(Sys.setenv('A4_X', '1')); .Internal(Sys.setenv('A4_X', '2')); Sys.getenv('A4_X', unset = NA) }",
  "{ Sys.setenv(A4_X = 'a', A4_Y = 2); Sys.getenv(c('A4_X', 'A4_Y'), unset = NA) }",
  "{ .Internal(Sys.setenv('HOME', '/a4')); path.expand('~/x') }",
]

["Sys.unsetenv"]
args = ["x"]
effect = "External"
domain = { x = ["=\"HOME\"", "=\"A4_NOT_SET\"", "@chr"] }
extra = [
  "{ Sys.setenv(A4_X = '1'); r <- .Internal(Sys.unsetenv('A4_X')); list(r, Sys.getenv('A4_X', unset = NA)) }",
  "{ r <- .Internal(Sys.unsetenv('HOME')); list(r, Sys.getenv('HOME', unset = NA)) }",
  "{ r <- .Internal(Sys.unsetenv(c('A4_NOT_SET', 'TMPDIR'))); list(r, Sys.getenv(c('A4_NOT_SET', 'TMPDIR'), unset = NA)) }",
]

