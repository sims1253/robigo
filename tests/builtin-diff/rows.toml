[strptime]
args = ["x", "format", "tz"]
typical = { x = "=\"2026-11-18 12:30:00\"", format = "=\"%Y-%m-%d %H:%M:%S\"", tz = "=\"UTC\"" }
# (every format has a full date: a format without one, "" or "TRUE" say,
# fills in today's date, from time(NULL), so GNU R's record of 11-18 is not
# robigo-rt's answer on 11-21; NA, a zero-length and a non-character format
# give NA or an error, the same on any day)
