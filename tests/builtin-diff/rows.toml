# (do_mapply calls FUN on `dots[[j]][[i]]`, the wrapper's own variable, so
# the raw cases above all stop at "object 'dots' not found"; these succeed)
extra = [
  "local({ dots <- list(1:3, 4:6); .Internal(mapply(function(x, y) x + y, dots, NULL)) })",
  "local({ dots <- list(a = 1:2, b = c(p = 3, q = 4)); .Internal(mapply(function(a, b, z) a + b + z, dots, list(z = 1))) })",
  "mapply(function(x, y) x + y, 1:3, 4:6)",
  "mapply(function(x, y) paste(x, y), c(a = 'p', b = 'q'), 1:2)",
  "mapply(rep, 1:3, 3:1)",
  "mapply(function(x, ...) list(x, ...), 1:2, MoreArgs = list(z = 1))",
  "mapply(function(x, y) x, 1:4, 1:2)",
  "mapply(function(x, y) x, 1:3, 1:2)",
  "mapply(function(x) x, list())",
  "mapply(function(x, y) c(x, y), 1:2, list('a', NULL), SIMPLIFY = FALSE)",
