  "local({ e <- new.env(); delayedAssign('p', 1 + 1, assign.env = e); .Internal(delayedBindingExpression(quote(p), e)) })",
  "local({ e <- new.env(); delayedAssign('p', 1 + 1, assign.env = e); force(e$p); .Internal(delayedBindingExpression(quote(p), e)) })",
