# Test corpora (see README.md). Each table is one corpus in a directory of
# the same name. Keys:
#   description       one line
#   mode              "script" (like Rscript FILE) or "echo" (like R -f FILE,
#                     the transcript R CMD check compares)
#   default_packages  R_DEFAULT_PACKAGES for GNU R and robigo
#   timeout           seconds per case
#   support           directory whose files are linked into each case's
#                     working directory

# Default packages: GNU R's, without `methods` until robigo can load it
# (goalpost G6). Then add it back here and re-record: today every case would
# fail on robigo's startup warning, hiding all other progress. Cases that
# need S4 attach methods themselves (help pages of methods and stats4 call
# library()).
[fastr]
description = "FastR's unit-test snippets (31k one-liners over builtins, S4, parser, ...), GPL-3"
mode = "script"
default_packages = "datasets,utils,grDevices,graphics,stats"
timeout = 30
commit = "f9d9199e51b371f076b19456933ee395d28360bf"
path = "com.oracle.truffle.r.test/src/com/oracle/truffle/r/test/ExpectedTestOutput.test"
# FastR-only features (Java interop, FastR's own functions).
exclude_prefix = ["library.fastr.", "rffi."]

[gnur-tests]
description = "GNU R 4.5.0's own regression tests (tests/*.R), as `make check` runs them"
mode = "echo"
default_packages = "datasets,utils,grDevices,graphics,stats"
timeout = 600
support = "support"
# Need the network, a build tree, or are driven by Makefile rules.
exclude = ["internet.R", "internet2.R", "libcurl.R", "download.file.R", "CRANtools.R", "demos.R", "demos2.R",
           "no-segfault.R", "isas-tests.R", "gct-foot.R", "misc-devel.R", "reg-tests-1-gct.R"]

# Each case of the C API corpus is an R driver (cases/<name>.R) plus its C
# source (support/<name>.c), compiled by build.sh with R CMD SHLIB before
# the cases run (the .so files are gitignored). GNU R's recorded output is
# robigo-capi's (G2) target; robigo fails every case today.
[capi]
description = "C API cases: small shared libraries exercising libR's symbols, driven from R"
mode = "script"
default_packages = "NULL"
timeout = 60
support = "support"
build = "build.sh"

[gnur-examples]
description = "The examples of every help page in GNU R 4.5.0's base and recommended-free packages"
mode = "echo"
default_packages = "datasets,utils,grDevices,graphics,stats"
timeout = 120
packages = ["base", "stats", "utils", "methods", "graphics", "grDevices", "datasets", "tools", "splines",
            "stats4", "grid", "parallel", "compiler"]

# Whole R programs: everyday scripts, not snippets (see
# tests/corpora/{gnur-demos,r-intro}/README.md). Both import from GNU R
# 4.5.0's sources with scripts/import-corpus-scripts.py.
[gnur-demos]
description = "Every demo() of GNU R 4.5.0's base packages, run as demo(topic, ask=FALSE, echo=TRUE)"
mode = "echo"
default_packages = "datasets,utils,grDevices,graphics,stats"
timeout = 300
importer = "corpus-scripts"

[r-intro]
description = "The runnable code of GNU R's \"An Introduction to R\" manual, one script per chapter"
mode = "echo"
default_packages = "datasets,utils,grDevices,graphics,stats"
timeout = 300
importer = "corpus-scripts"

# Help-page examples, demos and plain-R test scripts of pure-R CRAN
# packages (no compiled code, no compiled dependencies), with the package
# installed into support/lib by build.sh. Cases are whole scripts that
# attach a package, the way scripts use one. See
# tests/corpora/cran-purer/README.md for the packages and their licences.
[cran-purer]
description = "Help-page examples, demos and tests of pure-R CRAN packages (R6, withr, assertthat, proto, R.methodsS3)"
mode = "script"
default_packages = "datasets,utils,grDevices,graphics,stats"
timeout = 120
support = "support"
build = "build.sh"
importer = "corpus-scripts"
url = "https://cloud.r-project.org"
