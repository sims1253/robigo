# Own R packages, pinned by git commit, and their dependencies.
# Their test frameworks and Suggests are included so the suites run.
# Written by `scripts/package-suite.py lock --own`. A separate group:
# it does not change the CRAN selection or its numbers.
[project]
name = "robigo-own-package-suite"
r_version = "4.5"
repositories = [{ alias = "ppm", url = "https://packagemanager.posit.co/cran/__linux__/trixie/2026-11-01" }]
dependencies = [
  { name = "dagriculture", git = "https://github.com/sims1253/dagriculture.git", commit = "d00f3e11023cc43bc07dfa07daebbf3b19e35512" },
  { name = "bayesfam", git = "https://github.com/sims1253/bayesfam.git", commit = "3b5b8953cbbb755bcf8b21f901596e7c8e6832ee" },
  { name = "bayesgrove", git = "https://github.com/sims1253/bayesgrove.git", commit = "b105232389a45f51865ff7cd69c6826b784829c9" },
  { name = "bayesim", git = "https://github.com/sims1253/bayesim.git", commit = "352f082adaa896761cce39aa078a26b9a198f841" },
  { name = "huerd", git = "https://github.com/sims1253/huerd.git", commit = "0d21d3a22282f530b9bf4e192b65eb84114f2055" },
  { name = "ciecam16", git = "https://github.com/sims1253/ciecam16.git", commit = "e167c954a258e68e9e0207a6084a237107abe1de" },
  { name = "MASS" },
  { name = "actuar" },
  { name = "bayesplot" },
  { name = "brms" },
